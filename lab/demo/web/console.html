<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>DSH 演示控制台</title>
<style>
  :root{
    --bg:#eef2f8; --card:#fff; --line:#dbe3ee; --line2:#eef2f8;
    --ink:#16202f; --muted:#5b6b82; --dim:#8a99ad;
    --blue:#2563eb; --bluebg:#eef4ff; --bluebd:#c7dbff;
    --green:#0f8a5f; --greenbg:#eefaf4; --greenbd:#b7e6d2;
    --red:#d13b46; --redbg:#fff2f3; --redbd:#f5c6ca;
    --amber:#b45309; --amberbg:#fff8ea; --amberbd:#f5d99b;
    --violet:#6d3fd1; --violetbg:#f4f0ff; --violetbd:#d9ccff;
    --term:#0e1626; --termInk:#c9d6e8; --termDim:#6b7f9c;
    --tg:#5eead4; --tr:#fb7185; --ty:#fbbf24; --tb:#7dd3fc; --tv:#c4b5fd;
  }
  [data-theme="dark"]{
    --bg:#0a0f1c; --card:#131c30; --line:#26324a; --line2:#1b2740;
    --ink:#e6edf7; --muted:#8fa3bf; --dim:#5b6d88;
    --blue:#60a5fa; --bluebg:#152641; --bluebd:#2a4a78;
    --green:#34d399; --greenbg:#0f2a22; --greenbd:#1f5c46;
    --red:#fb7185; --redbg:#2a1420; --redbd:#5c2434;
    --amber:#fbbf24; --amberbg:#2a2010; --amberbd:#5c4520;
    --violet:#a78bfa; --violetbg:#221a3d; --violetbd:#4a3a80;
    --term:#080e1a; --termInk:#c9d6e8; --termDim:#5b6d88;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;}

  header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);
         background:var(--card);flex-wrap:wrap;z-index:5;}
  .brand{display:flex;flex-direction:column;gap:1px;margin-right:6px;}
  .kick{font-size:9.5px;letter-spacing:.18em;color:var(--blue);font-weight:800;}
  h1{font-size:15px;font-weight:800;}
  .sp{flex:1;}
  select,input[type=text]{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);
        color:var(--ink);font-size:12.5px;font-family:inherit;outline:none;}
  select:focus,input:focus{border-color:var(--blue);}
  .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.pri:hover{filter:brightness(1.08);color:#fff;}
  .btn.danger{background:var(--redbg);border-color:var(--redbd);color:var(--red);}
  .btn[disabled]{opacity:.42;cursor:not-allowed;filter:none;}
  .btn.icon{width:34px;padding:7px 0;text-align:center;}
  .sw{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;}
  .sw input{accent-color:var(--blue);}

  main{display:grid;grid-template-columns:352px 1fr;min-height:0;}
  .left{border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;}
  .left::-webkit-scrollbar,.logs::-webkit-scrollbar,.ctx::-webkit-scrollbar,.code::-webkit-scrollbar{width:6px;}
  .left::-webkit-scrollbar-thumb,.logs::-webkit-scrollbar-thumb,.ctx::-webkit-scrollbar-thumb,.code::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .sec{font-size:9.5px;letter-spacing:.14em;font-weight:800;color:var(--dim);margin-bottom:7px;display:flex;justify-content:space-between;}

  .track{display:flex;flex-direction:column;gap:2px;}
  .ti{display:flex;gap:9px;padding:6px 8px;border-radius:8px;border:1px solid transparent;}
  .ti .d{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;
         display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:var(--card);}
  .ti.on{border-color:var(--blue);background:var(--bluebg);}
  .ti.on .d{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluebg);}
  .ti.done .d{background:var(--green);border-color:var(--green);}
  .ti.done .d::after{content:"✓";}
  .ti.fail .d{background:var(--red);border-color:var(--red);}
  .ti.fail .d::after{content:"!";}
  .ti .t{font-size:12px;font-weight:700;}
  .ti .s{font-size:10px;color:var(--dim);margin-top:1px;}

  .wl{border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .wl .row{display:flex;align-items:center;gap:7px;padding:6px 9px;font-family:ui-monospace,Menlo,monospace;
           font-size:11px;border-bottom:1px solid var(--line2);}
  .wl .row:last-child{border-bottom:none;}
  .wl .no{color:var(--dim);}
  .wl .ok{color:var(--green);font-weight:800;}
  .wl .bad{color:var(--red);font-weight:800;}
  .wl .rs{color:var(--dim);font-size:10px;margin-left:auto;}
  .wl .empty{padding:10px;font-size:11px;color:var(--dim);}

  .water{padding:10px;border:1px solid var(--line);border-radius:9px;}
  .wtxt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:800;margin-bottom:6px;}
  .wtxt b{color:var(--ink);font-size:12px;letter-spacing:0;}
  .wbar{height:14px;border-radius:7px;background:var(--line2);overflow:hidden;position:relative;}
  .wbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#5b9bf8,#2563eb);transition:width .4s;}
  .wbar i.hot{background:linear-gradient(90deg,#f3b64d,#dc8a0b);}
  .wbar i.low{background:linear-gradient(90deg,#3ecf9a,#0f8a5f);}
  .wtick{position:absolute;top:-2px;bottom:-2px;width:2px;background:#1f2d42;left:85%;box-shadow:0 0 0 1px var(--card);}
  .whint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5;}

  .right{display:flex;flex-direction:column;min-height:0;}
  .tabs{display:flex;gap:6px;padding:9px 14px 0;border-bottom:1px solid var(--line);background:var(--card);}
  .tab{padding:7px 14px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;
       font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
  .tab.on{background:var(--bg);border-color:var(--line);color:var(--ink);margin-bottom:-1px;}
  .pane{flex:1;min-height:0;display:none;overflow:hidden;}
  .pane.on{display:flex;}

  .logs{flex:1;overflow:auto;background:var(--term);color:var(--termInk);padding:11px 14px;
        font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;}
  .ln{white-space:pre-wrap;word-break:break-word;animation:fade .18s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}
  .ln.cmd{color:#fff;font-weight:700;}.ln.dim{color:var(--termDim);}
  .ln.ok{color:var(--tg);}.ln.err{color:var(--tr);}.ln.warn{color:var(--ty);}
  .ln.info{color:var(--tb);}.ln.vio{color:var(--tv);}

  .codes{flex:1;display:grid;grid-template-columns:180px 1fr;min-height:0;}
  .flist{border-right:1px solid var(--line);overflow:auto;padding:8px;background:var(--card);}
  .fitem{padding:7px 9px;border-radius:7px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;
         cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .fitem:hover{background:var(--bluebg);}
  .fitem.on{background:var(--bluebg);color:var(--blue);font-weight:800;}
  .fitem .dotc{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;display:none;}
  .fitem.changed .dotc{display:block;}
  .code{overflow:auto;background:var(--term);color:var(--termInk);padding:10px 14px;
        font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre;}
  .ctx{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .msg{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card);}
  .msg .h{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .role{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;}
  .r-system{background:var(--violetbg);color:var(--violet);}
  .r-user{background:var(--bluebg);color:var(--blue);}
  .r-assistant{background:var(--greenbg);color:var(--green);}
  .r-tool{background:#f2f4f7;color:#475467;}
  .msg .n{font-size:10px;color:var(--dim);margin-left:auto;}
  .msg .c{font-size:11px;color:var(--muted);line-height:1.55;font-family:ui-monospace,Menlo,monospace;
          white-space:pre-wrap;word-break:break-word;max-height:88px;overflow:hidden;}
  .msg.open .c{max-height:none;}
  .cmp{margin:6px 0 2px;border:1px dashed var(--greenbd);border-radius:9px;padding:9px 11px;background:var(--greenbg);}
  .cmp b{color:var(--green);}

  footer{display:flex;align-items:center;gap:12px;padding:8px 18px;border-top:1px solid var(--line);
         background:var(--card);font-size:11.5px;color:var(--dim);}
  .stat{font-weight:800;font-size:11.5px;}
  .stat.idle{color:var(--dim);}.stat.run{color:var(--blue);}.stat.ok{color:var(--green);}.stat.bad{color:var(--red);}
  .prog{flex:0 0 200px;height:4px;border-radius:3px;background:var(--line2);overflow:hidden;}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s;}

  /* 审批弹层 */
  .mask{position:fixed;inset:0;background:rgba(8,14,26,.5);backdrop-filter:blur(1.5px);
        display:none;align-items:center;justify-content:center;z-index:50;}
  .mask.on{display:flex;}
  .modal{width:520px;background:var(--card);border-radius:14px;border:1px solid var(--line);
         box-shadow:0 30px 80px -30px rgba(0,0,0,.6);overflow:hidden;animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:none;opacity:1;}}
  .modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;}
  .modal .hd .ic{width:22px;height:22px;border-radius:50%;background:var(--amberbg);color:var(--amber);
                 display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  .modal .hd b{font-size:14px;}
  .modal .bd{padding:14px 18px;font-size:12.5px;line-height:1.65;color:var(--muted);}
  .modal .bd .dl{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink);
                 background:var(--line2);border-radius:7px;padding:8px 10px;margin-top:8px;}
  .modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="kick">DSH 演示控制台</span><h1>推送任务 → 看它怎么跑</h1></div>
    <select id="taskSel"></select>
    <input type="text" id="freeText" placeholder="或者直接描述一个任务（可选）" style="width:300px;">
    <label class="sw"><input type="checkbox" id="mock" checked> 离线 mock</label>
    <label class="sw"><input type="checkbox" id="autoAp"> 自动批准</label>
    <button class="btn pri" id="run">▶ 推送任务</button>
    <button class="btn danger" id="stop" disabled>■ 停止</button>
    <div class="sp"></div>
    <button class="btn icon" id="theme">🌙</button>
  </header>

  <main>
    <div class="left">
      <div>
        <div class="sec"><span>流程轨道</span><span id="stageCnt">0 / 6</span></div>
        <div class="track" id="track"></div>
      </div>

      <div>
        <div class="sec"><span>命令白名单</span><span id="wlCnt">0 次</span></div>
        <div class="wl" id="wl"><div class="empty">还没有执行过命令</div></div>
      </div>

      <div>
        <div class="sec"><span>上下文水位</span><span id="tokTxt">0 tok</span></div>
        <div class="water">
          <div class="wtxt"><span>估算占用</span><b id="pct">0%</b></div>
          <div class="wbar"><i id="wfill"></i><div class="wtick"></div></div>
          <div class="whint">阈值 85% · 窗口 128k（预留输出 16k）<br>
            <button class="btn" id="compactBtn" style="margin-top:6px;padding:4px 10px;font-size:11px;">模拟触发压缩</button>
          </div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="tabs">
        <div class="tab on" data-p="logs">运行日志</div>
        <div class="tab" data-p="code">工作区代码</div>
        <div class="tab" data-p="ctx">上下文 <span id="msgCnt">0</span></div>
      </div>

      <div class="pane on" id="pane-logs"><div class="logs" id="logs"></div></div>

      <div class="pane" id="pane-code">
        <div class="codes">
          <div class="flist" id="flist"></div>
          <div class="code" id="code"></div>
        </div>
      </div>

      <div class="pane" id="pane-ctx"><div class="ctx" id="ctx"></div></div>
    </div>
  </main>

  <footer>
    <span class="stat idle" id="stat">未开始</span>
    <div class="prog"><i id="prog"></i></div>
    <span id="meta"></span>
    <div class="sp"></div>
    <span>门禁：<b id="gate">—</b>　被拒：<b id="denied">0</b>　步数：<b id="steps">0</b></span>
  </footer>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="hd"><span class="ic">⏸</span><b>需要你确认</b></div>
    <div class="bd">
      <div id="apAction"></div>
      <div class="dl" id="apDetail"></div>
    </div>
    <div class="ft">
      <button class="btn" id="apReject">拒绝</button>
      <button class="btn pri" id="apAllow">通过</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const STAGES = [
  ['任务接收','读 tasks.md，装配上下文'],
  ['读代码','list_files / read_file'],
  ['工具执行','白名单校验 → 执行'],
  ['人工介入','高危动作停下来问'],
  ['门禁','门禁脚本的退出码'],
  ['完成','门禁绿才算完成']
];
let stageState = {}, files = {}, changed = new Set(), curFile = null,
    msgs = [], tokens = 0, runState = 'idle', stageIdx = 0, wlCount = 0;

/* ---------- 主题 ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t==='dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('console-theme', t); }catch(e){}
}
setTheme((()=>{try{return localStorage.getItem('console-theme')}catch(e){return null}})() || 'light');
$('#theme').onclick = ()=> setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- 轨道 ---------- */
function renderTrack(){
  $('#track').innerHTML = STAGES.map(([t,s],i)=>{
    const st = stageState[i] || '';
    return `<div class="ti ${st}" data-i="${i}">
      <span class="d"></span><div><div class="t">${i+1}. ${t}</div><div class="s">${s}</div></div></div>`;
  }).join('');
  const done = Object.keys(stageState).length;
  $('#stageCnt').textContent = done + ' / ' + STAGES.length;
  $('#prog').style.width = (done/STAGES.length*100) + '%';
}
function mark(i, st){ if(st==='on'){ for(const k in stageState) if(stageState[k]==='on'&&+k!==i) stageState[k]='done'; } stageState[i]=st; renderTrack(); }

/* ---------- 日志 ---------- */
function log(kind, text){
  const d = document.createElement('div');
  d.className = 'ln ' + kind; d.textContent = text;
  const box = $('#logs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.appendChild(d);
  if(atBottom) box.scrollTop = box.scrollHeight;
}

/* ---------- 白名单 ---------- */
let wlRules = [];
function renderWL(){
  const box = $('#wl');
  if(!wlRules.length && !wlCount){ box.innerHTML='<div class="empty">还没有执行过命令</div>'; return; }
  const rules = wlRules.map(r=>`<div class="row"><span class="no">规则</span>${r}</div>`).join('');
  box.innerHTML = wlRules.length ? rules : '';
  if(wlLog.length===0 && wlRules.length) return;
  box.innerHTML += wlLog.map(x=>`<div class="row">
      <span class="${x.allowed?'ok':'bad'}">${x.allowed?'✓':'✗'}</span>
      <span>${x.cmd}</span>
      <span class="rs">${x.allowed?('命中 '+x.rule):'不在白名单'}</span></div>`).join('');
}
let wlLog = [];

/* ---------- 代码 ---------- */
function renderFiles(){
  const list = Object.keys(files);
  $('#flist').innerHTML = list.map(f=>
    `<div class="fitem ${f===curFile?'on':''} ${changed.has(f)?'changed':''}" data-f="${f}">
       <span class="dotc"></span>${f}</div>`).join('') || '<div class="fitem">（加载中）</div>';
  $('#flist').querySelectorAll('.fitem').forEach(el=>el.onclick=()=>{ curFile=el.dataset.f; renderFiles(); renderCode(); });
}
function renderCode(){
  $('#code').textContent = files[curFile] || '（选一个文件）';
}

/* ---------- 上下文 ---------- */
function renderCtx(){
  const box = $('#ctx');
  if(!msgs.length){ box.innerHTML = '<div style="color:var(--dim);font-size:12px;">还没有上下文。先推送一个任务。</div>'; $('#msgCnt').textContent='0'; return; }
  box.innerHTML = msgs.map(m=>`
    <div class="msg" data-i="${m.i}">
      <div class="h"><span class="role r-${m.role}">${m.role}</span>
        ${m.calls.length?`<span style="font-size:10px;color:var(--blue)">调用 ${m.calls.join(', ')}</span>`:''}
        <span class="n">${m.chars} 字符${m.truncated?' · 截断':''}</span></div>
      <div class="c">${(m.preview||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>
    </div>`).join('');
  box.querySelectorAll('.msg').forEach(el=>el.onclick=()=>el.classList.toggle('open'));
  $('#msgCnt').textContent = msgs.length;
}
function setTokens(t){
  tokens = t||0;
  const pct = Math.min(100, tokens/1120);
  $('#pct').textContent = Math.round(pct) + '%';
  $('#tokTxt').textContent = (tokens>=1000?(tokens/1000).toFixed(1)+'k':tokens) + ' tok';
  const f = $('#wfill'); f.style.width = pct+'%';
  f.className = pct>=85?'hot':(pct<=30?'low':'');
}

/* ---------- 状态 ---------- */
function setStat(s, txt){
  runState = s;
  const el = $('#stat'); el.className = 'stat ' + s; el.textContent = txt;
  $('#run').disabled = (s==='run');
  $('#stop').disabled = (s!=='run');
}

/* ---------- 事件 ---------- */
function handle(ev){
  switch(ev.type){
    case 'clear':
      $('#logs').innerHTML=''; msgs=[]; tokens=0; wlLog=[]; wlRules=[]; changed.clear();
      stageState={}; stageIdx=0; renderTrack(); renderCtx(); renderWL(); setTokens(0);
      $('#gate').textContent='—'; $('#denied').textContent='0'; $('#steps').textContent='0';
      break;

    case 'run_start':
      mark(0,'on'); log('cmd','$ python3 -m agent  --task "' + (ev.task||'').split('\n')[0].slice(0,60) + '…"');
      log('dim','模型：' + ev.model + '　工作区：' + ev.workspace.split('/').slice(-2).join('/'));
      setStat('run','运行中');
      $('#meta').textContent = ev.model === 'MOCK' ? 'MOCK 模式（不调 API）' : ev.model;
      break;

    case 'assistant':
      if(ev.calls && ev.calls.length){
        mark(0,'done'); mark(2,'on');
        log('info', `[step ${ev.step}] 模型要调用：${ev.calls.join(', ')}`);
      }
      break;

    case 'tool_call':
      if(['list_files','read_file'].includes(ev.name)){ mark(1,'on'); }
      log('dim', `[step ${ev.step}] → ${ev.name}(${JSON.stringify(ev.args).slice(0,90)})`);
      break;

    case 'whitelist':
      wlCount++; $('#wlCnt').textContent = wlCount + ' 次';
      if(ev.rules && !wlRules.length) wlRules = ev.rules;
      wlLog.unshift({ cmd:(ev.argv||[]).join(' '), allowed:ev.allowed, rule:ev.rule });
      renderWL();
      if(!ev.allowed){ log('err', '        ⛔ 被拒：不在白名单 ' + (ev.argv||[]).join(' ')); mark(2,'fail'); }
      else log('dim', '        ✓ 命中白名单：' + ev.rule);
      break;

    case 'gate':
      mark(4, ev.code===0?'done':'fail');
      log(ev.code===0?'ok':'err', `        → 门禁退出码 ${ev.code}`);
      $('#gate').textContent = ev.code===0 ? '绿 (0)' : '红 ('+ev.code+')';
      break;

    case 'approval_request':
      mark(3,'on');
      $('#apAction').textContent = ev.action;
      $('#apDetail').textContent = ev.detail;
      $('#mask').classList.add('on');
      log('warn', '  ⏸ 需要确认：' + ev.action + ' ' + ev.detail);
      pendingId = ev.id;
      if(SHOT) setTimeout(()=>es.close(), 700);
      break;

    case 'approval_auto':
      mark(3,'done');
      log('warn','  [审批] ' + ev.action + ' ' + ev.detail + '  → 自动通过（--auto）');
      break;

    case 'approval_decided':
      $('#mask').classList.remove('on');
      mark(3,'done');
      log(ev.decision==='allow'?'ok':'err', '  → 人决定：' + (ev.decision==='allow'?'通过':'拒绝'));
      break;

    case 'file_write':
      changed.add(ev.path); files[ev.path] = ev.after || files[ev.path] || '';
      curFile = curFile || ev.path;
      renderFiles(); renderCode();
      log('ok', `        ✓ 写入 ${ev.path}（${ev.bytes} 字节）`);
      break;

    case 'context':
      msgs = ev.messages || []; setTokens(ev.tokens||0); renderCtx();
      break;

    case 'escalate':
      log('err', `[step ${ev.step}] ⚠ ${ev.reason} → 升级人工`);
      mark(4,'fail');
      break;

    case 'compact':
      log('vio', `【压缩】${ev.before.count} 条 → ${ev.after.count} 条，` +
          `${ev.before.tokens} → ${ev.after.tokens} tok（压掉 ${ev.covered} 条）`);
      break;

    case 'error':
      log('err', '✖ ' + ev.message);
      setStat('bad','出错');
      mark(stageIdx,'fail');
      break;

    case 'run_end': {
      $('#denied').textContent = ev.denied ?? 0;
      $('#steps').textContent = (ev.steps||0) + '/' + (ev.max_steps||'?');
      const ok = ev.status==='done' && ev.gate===0;
      $('#gate').textContent = ev.gate===null||ev.gate===undefined ? '—' : (ev.gate===0?'绿 (0)':'红 ('+ev.gate+')');
      Object.keys(stageState).forEach(k=>{ if(stageState[k]==='on') stageState[k]='done'; });
      if(ok){ mark(5,'done'); setStat('ok','✅ 完成且门禁绿'); }
      else if(ev.status==='cancelled'){ setStat('idle','已停止'); }
      else if(ev.status==='escalated'){ setStat('bad','⚠ 已升级人工'); }
      else { setStat('bad','未完成（' + ev.status + '）'); }
      log(ok?'ok':'err', `\n终止：${ev.status}　门禁：${ev.gate}　被拒：${ev.denied}　步数：${ev.steps}/${ev.max_steps}`);
      if(SHOT) setTimeout(()=>es.close(), 700);
      break;
    }

    case 'done':
      setStat(runState==='run'?'idle':runState, runState==='run'?'已结束':$('#stat').textContent);
      break;

    case 'compact_result':
      renderCtx(); setTokens(ev.tokens);
      break;
  }
}

let pendingId = null;
$('#apAllow').onclick = ()=> decid('allow');
$('#apReject').onclick = ()=> decid('reject');
function decid(d){
  if(!pendingId) return;
  fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:pendingId, decision:d})});
  $('#mask').classList.remove('on'); pendingId = null;
}

/* ---------- SSE ---------- */
const SHOT = new URLSearchParams(location.search).has('shot');
const es = new EventSource('/api/events');
es.onmessage = e => { try{ handle(JSON.parse(e.data)); }catch(err){ console.error(err); } };
es.onerror = () => { /* 浏览器会自动重连 */ };

/* ---------- 启动 ---------- */
async function init(){
  renderTrack(); renderCtx(); renderWL(); setTokens(0);
  const r = await fetch('/api/tasks').then(x=>x.json());
  $('#taskSel').innerHTML = r.tasks.map(t=>`<option value="${t.id}" title="${t.note||''}">${t.name}</option>`).join('');
  const want = new URLSearchParams(location.search).get('task');
  if(want && r.tasks.some(t=>t.id===want)) $('#taskSel').value = want;
  $('#mock').checked = true;
  await refreshFiles();
}
async function refreshFiles(){
  const id = $('#taskSel').value || '';
  const r = await fetch('/api/workspace?id=' + encodeURIComponent(id)).then(x=>x.json());
  files = r.files || {};
  curFile = curFile && files[curFile] ? curFile : Object.keys(files)[0];
  renderFiles(); renderCode();
}

$('#taskSel').onchange = async ()=>{
  changed.clear(); curFile = null;
  await refreshFiles();
  log('dim','已切换到：' + $('#taskSel').selectedOptions[0].textContent);
};

$('#run').onclick = async ()=>{
  const taskId = $('#taskSel').value;
  const text = $('#freeText').value.trim();
  if(text) log('warn','⚠ 自由任务仍受同一份门禁约束（shared/check.py）');
  setStat('run','启动中…');
  stageState = {}; stageIdx = 0; renderTrack();
  await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({taskId, text, mock:$('#mock').checked, autoApprove:$('#autoAp').checked})});
};
$('#stop').onclick = ()=> fetch('/api/stop',{method:'POST'});

$('#compactBtn').onclick = async ()=>{
  const r = await fetch('/api/compact',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({keepLast:3})}).then(x=>x.json());
  if(r.error){ log('warn','压缩跳过：' + r.error); return; }
  const res = r.result;
  if(res.skipped){ log('warn','压缩跳过：' + res.reason); return; }
  msgs = r.messages; setTokens(r.tokens); renderCtx();
  const box = $('#ctx');
  box.insertAdjacentHTML('afterbegin',
    `<div class="cmp"><b>压缩完成</b>：${res.before.count} 条 → ${res.after.count} 条，
     ${res.before.tokens} → ${res.after.tokens} tok（压掉 ${res.covered} 条，
     剩 ${(res.ratio*100).toFixed(0)}%）<br>
     <span style="color:var(--muted);font-size:11px;">原始事件仍在 runs/web.jsonl 里，可回放 —— 压缩改的是投影，不是日志</span></div>`);
};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('#pane-'+t.dataset.p).classList.add('on');
});

init().then(()=>{
  const q = new URLSearchParams(location.search);
  if(q.has('auto')) $('#autoAp').checked = true;
  if(q.has('tab')) document.querySelector(`.tab[data-p="${q.get('tab')}"]`).click();
  if(q.has('compact')){
    const es2 = new EventSource('/api/events');
    es2.onmessage = e => {
      const ev = JSON.parse(e.data);
      if(ev.type === 'run_end'){ es2.close(); setTimeout(()=>$('#compactBtn').click(), 500); }
    };
  }
  if(q.has('demo')) setTimeout(()=>$('#run').click(), 600);
});
</script>
