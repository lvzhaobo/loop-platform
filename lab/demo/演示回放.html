<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>演示回放 · 一次任务的闭环</title>
<style>
  :root{
    --bg:#f4f7fb; --bg2:#eef2f9; --card:#ffffff; --line:#dbe3ee; --line2:#e8eef6;
    --ink:#16202f; --muted:#5b6b82; --dim:#8a99ad;
    --blue:#2563eb; --bluebg:#eef4ff; --bluebd:#c7dbff;
    --green:#0f8a5f; --greenbg:#eefaf4; --greenbd:#b7e6d2;
    --red:#d13b46; --redbg:#fff2f3; --redbd:#f5c6ca;
    --amber:#c2740b; --amberbg:#fff8ea; --amberbd:#f5d99b;
    --term-bg:#fbfcfe; --term-ink:#33445c; --term-dim:#8a99ad; --term-cmd:#0f172a;
    --term-green:#0f8a5f; --term-red:#d13b46; --term-amber:#a85f06;
    --term-blue:#2563eb; --term-line:#e2e9f3;
    --shadow:0 18px 44px -26px rgba(22,32,47,.32);
  }
  [data-theme="dark"]{
    --bg:#0b1020; --bg2:#0e1526; --card:#131c30; --line:#26324a; --line2:#1b2740;
    --ink:#e6edf7; --muted:#8fa3bf; --dim:#5b6d88;
    --blue:#60a5fa; --bluebg:#152641; --bluebd:#2a4a78;
    --green:#34d399; --greenbg:#0f2a22; --greenbd:#1f5c46;
    --red:#fb7185; --redbg:#2a1420; --redbd:#5c2434;
    --amber:#fbbf24; --amberbg:#2a2010; --amberbd:#5c4520;
    --term-bg:#080e1a; --term-ink:#c9d6e8; --term-dim:#5b6d88; --term-cmd:#ffffff;
    --term-green:#5eead4; --term-red:#fb7185; --term-amber:#fbbf24;
    --term-blue:#7dd3fc; --term-line:#16233a;
    --shadow:0 18px 44px -26px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:radial-gradient(900px 500px at 0% -10%,var(--bg2) 0%,transparent 55%),var(--bg);
    color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;}

  header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);
         background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(8px);flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .kick{font-size:10px;letter-spacing:.18em;color:var(--blue);font-weight:800;}
  h1{font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .sp{flex:1;}
  .btn{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.pri:hover{filter:brightness(1.08);color:#fff;}
  .btn[disabled]{opacity:.42;cursor:not-allowed;}
  .btn.icon{width:36px;padding:7px 0;text-align:center;font-size:14px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;
              padding:7px 11px;cursor:pointer;font-family:inherit;}
  .seg button.on{background:var(--bluebg);color:var(--blue);}

  main{display:grid;grid-template-columns:330px 1fr;min-height:0;}
  .track{border-right:1px solid var(--line);padding:14px 12px;overflow:auto;background:color-mix(in srgb,var(--card) 60%,transparent);}
  .track::-webkit-scrollbar,.term-body::-webkit-scrollbar{width:6px;}
  .track::-webkit-scrollbar-thumb,.term-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .titem{display:flex;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.16s;
         border:1px solid transparent;margin-bottom:2px;}
  .titem:hover{background:var(--bluebg);}
  .titem.on{border-color:var(--blue);background:var(--bluebg);}
  .titem.done .dot{background:var(--green);border-color:var(--green);}
  .titem.done .dot::after{content:"✓";color:#fff;font-size:8px;}
  .titem.fail .dot{background:var(--red);border-color:var(--red);}
  .titem.fail .dot::after{content:"!";color:#fff;font-size:9px;}
  .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;
       display:flex;align-items:center;justify-content:center;background:var(--card);transition:.2s;}
  .titem.on .dot{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluebg);}
  .tlabel{font-size:12.5px;font-weight:700;line-height:1.4;}
  .tnote{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;}

  .stage{display:flex;flex-direction:column;min-height:0;padding:14px 18px 10px;}
  .note{border:1px solid var(--amberbd);background:var(--amberbg);border-radius:10px;padding:10px 14px;
        font-size:12.5px;line-height:1.6;color:var(--ink);margin-bottom:10px;min-height:44px;
        display:flex;align-items:center;gap:9px;transition:.2s;}
  .note .tag{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--amber);
             border:1px solid var(--amberbd);border-radius:5px;padding:2px 6px;}
  .term{flex:1;min-height:0;border-radius:12px;background:var(--term-bg);border:1px solid var(--term-line);
        display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
  .term-bar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--term-line);}
  .tl{width:9px;height:9px;border-radius:50%;background:#c9d5e6;}
  .tl.r{background:#e5484d;} .tl.y{background:#f5a524;} .tl.g{background:#2fb344;}
  .term-title{margin-left:8px;font-size:11px;color:var(--term-dim);font-weight:700;letter-spacing:.04em;}
  .term-body{flex:1;overflow:auto;padding:12px 16px 16px;
             font-family:ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
             font-size:12.5px;line-height:1.75;color:var(--term-ink);}
  .ln{white-space:pre-wrap;word-break:break-word;animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}
  .ln.cmd{color:var(--term-cmd);font-weight:700;}
  .ln.dim{color:var(--term-dim);}
  .ln.ok{color:var(--term-green);}
  .ln.err{color:var(--term-red);}
  .ln.deny{color:var(--term-red);font-weight:700;}
  .ln.warn{color:var(--term-amber);}
  .ln.info{color:var(--term-blue);}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--term-green);vertical-align:-2px;
          animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  footer{display:flex;align-items:center;gap:12px;padding:9px 22px;border-top:1px solid var(--line);
         background:color-mix(in srgb,var(--card) 78%,transparent);font-size:11.5px;color:var(--dim);}
  .prog{flex:1;max-width:320px;height:4px;border-radius:3px;background:var(--line2);overflow:hidden;}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s;}
  .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid var(--line);}
  .badge.red{color:var(--red);border-color:var(--redbd);background:var(--redbg);}
  .badge.green{color:var(--green);border-color:var(--greenbd);background:var(--greenbg);}
  .badge.idle{color:var(--dim);}
  @media (max-width:1100px){ main{grid-template-columns:1fr;} .track{display:none;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="kick">真实运行记录 · 可回放</span>
      <h1>一次任务的闭环：门禁 → agent → 门禁</h1>
    </div>
    <div class="sp"></div>
    <div class="seg" id="speed">
      <button data-s="1" class="on">1×</button>
      <button data-s="2">2×</button>
      <button data-s="3">4×</button>
    </div>
    <button class="btn pri" id="play">▶ 开始演示</button>
    <button class="btn" id="next">下一步</button>
    <button class="btn" id="reset">重置</button>
    <button class="btn icon" id="theme" title="切换主题">🌙</button>
  </header>

  <main>
    <div class="track" id="track"></div>
    <div class="stage">
      <div class="note" id="note"><span class="tag">说明</span><span id="noteText">点「开始演示」，看一次改代码是怎么走完全流程的。</span></div>
      <div class="term">
        <div class="term-bar">
          <i class="tl r"></i><i class="tl y"></i><i class="tl g"></i>
          <span class="term-title">demo — python3 main.py --mock --yes</span>
        </div>
        <div class="term-body" id="term"></div>
      </div>
    </div>
  </main>

  <footer>
    <span id="stamp">未开始</span>
    <div class="badge idle" id="gateBadge">门禁：—</div>
    <div class="prog"><i id="prog"></i></div>
    <div class="sp"></div>
    <span>这不是录屏：每一行都来自真实运行，只是被放慢了。</span>
  </footer>
</div>

<script>
/* ============ 数据：来自真实运行的输出 ============ */
const STEPS = [
  { id:'gate1', label:'① 门禁先说话', note:'它不是文档，是可执行的裁判。', kind:'fail',
    lines:[
      ['cmd','$ python3 shared/check.py'],
      ['dim','门禁：shared/fixture/pomodoro'],
      ['dim','────────────────────────────────────────'],
      ['err','❌ 存在 work-minutes / break-minutes 两个数字输入框'],
      ['dim','     └─ 没找到 id="work-minutes" 的 input'],
      ['err','❌ app.js 从这两个控件读取数值'],
      ['ok','✅ 按「分钟 × 60」换算成秒'],
      ['err','❌ 非法值（≤0 / >180 / NaN）回退到 25 / 5'],
      ['ok','✅ 原有功能没被改坏'],
      ['ok','✅ 零依赖：没有引入外部脚本'],
      ['ok','✅ 门禁自身未被修改（裁判不是选手）'],
      ['dim','────────────────────────────────────────'],
      ['err','4/7 通过 —— 门禁红，不许合并'],
      ['cmd','$ echo $?  →  1'],
    ]},
  { id:'safe', label:'② 安全检查', note:'闸门的前提，是闸门本身改不到。', kind:'ok',
    lines:[
      ['cmd','$ python3 main.py --check-safety'],
      ['info','【安全检查】'],
      ['dim','  harness 目录 : demo/A-python'],
      ['dim','  工作区       : demo/shared/fixture/pomodoro'],
      ['ok','  ✅ harness 在工作区之外 —— agent 改不到自己的闸门'],
    ]},
  { id:'read', label:'③ 先读再改（step 1-3）', note:'上下文是读出来的，不是猜出来的。', kind:'ok',
    lines:[
      ['cmd','$ python3 main.py --mock --yes'],
      ['info','[step 1] → list_files({"dir": "."})'],
      ['info','[step 2] → read_file({"path": "index.html"})'],
      ['info','[step 3] → read_file({"path": "app.js"})'],
    ]},
  { id:'deny', label:'④ 越权被拒（step 4）', note:'模型想删，但它连执行的机会都没有——白名单在 Python 的 if 里，不在提示词里。', kind:'fail',
    lines:[
      ['info','[step 4] → run_command({"argv": ["rm", "-rf", "src"]})'],
      ['deny','        ⛔ 被拒：不在白名单：[\'rm\', \'-rf\', \'src\']'],
      ['dim','           只能跑 python check.py, python3 check.py, ls, cat, node --check'],
      ['warn','  ← 提示词里写「允许执行任何命令」也没用：这条 if 读的是工具层，不是提示词'],
    ]},
  { id:'regate', label:'⑤ 复查门禁（step 5）', note:'门禁先说话，agent 才知道要干什么。', kind:'fail',
    lines:[
      ['info','[step 5] → run_check({})'],
      ['err','        → code=1'],
    ]},
  { id:'write', label:'⑥ 改代码（step 6-7）', note:'行前闸门：高危动作先问人。--yes 只是演示，生产里必须真问。', kind:'ok',
    lines:[
      ['info','[step 6] → write_file({"path": "index.html", ...})'],
      ['warn','  [审批] 写入文件  index.html（773 → 931 字符）   → 自动通过（--yes）'],
      ['ok','        ✓ index.html 963'],
      ['info','[step 7] → write_file({"path": "app.js", ...})'],
      ['warn','  [审批] 写入文件  app.js（1859 → 2627 字符）   → 自动通过（--yes）'],
      ['ok','        ✓ app.js 2741'],
    ]},
  { id:'green', label:'⑦ 门禁通过（step 8）', note:'唯一能宣告「完成」的东西，是退出码。', kind:'ok',
    lines:[
      ['info','[step 8] → run_check({})'],
      ['ok','        → code=0'],
    ]},
  { id:'end', label:'⑧ 收尾（step 9）', note:'模型说「我完成了」不算数——门禁绿才算。', kind:'ok',
    lines:[
      ['info','[step 9] 模型结束：门禁已绿，任务完成。'],
      ['dim','────────────────────────────────────────'],
      ['ok','终止：done    门禁退出码：0    被拒次数：1    步数：9/30'],
      ['ok','会话：demo/runs/A.jsonl（20 条事件，可回放）'],
      ['ok','✅ 任务完成且门禁绿'],
    ]},
];

/* ============ 状态 ============ */
const $ = s => document.querySelector(s);
const term = $('#term'), track = $('#track'), noteText = $('#noteText'),
      prog = $('#prog'), stamp = $('#stamp'), gateBadge = $('#gateBadge');

let cur = -1, lineIdx = 0, timer = null, playing = false, speed = 1;
let status = {};   // id -> 'done' | 'fail'

/* ============ 轨道 ============ */
function renderTrack(){
  track.innerHTML = STEPS.map((s,i)=>{
    const cls = ['titem'];
    if(i===cur) cls.push('on');
    if(status[s.id]==='done') cls.push('done');
    if(status[s.id]==='fail') cls.push('fail');
    return `<div class="${cls.join(' ')}" data-i="${i}">
      <span class="dot"></span>
      <div><div class="tlabel">${s.label}</div><div class="tnote">${s.note}</div></div>
    </div>`;
  }).join('');
  track.querySelectorAll('.titem').forEach(el=>{
    el.onclick = ()=>{ pause(); goto(+el.dataset.i); };
  });
}

/* ============ 终端 ============ */
function appendLine(kind, text){
  const d = document.createElement('div');
  d.className = 'ln ' + kind;
  d.textContent = text;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function clearTerm(){ term.innerHTML = ''; }

/* ============ 播放 ============ */
function setStamp(){
  const total = STEPS.length;
  stamp.textContent = cur < 0 ? '未开始' : `第 ${cur+1} / ${total} 阶段`;
  prog.style.width = cur<0 ? '0%' : ((cur+1)/total*100)+'%';
}
function setGate(s){
  gateBadge.className = 'badge ' + s;
  gateBadge.textContent = s==='red' ? '门禁：红（4/7）' : s==='green' ? '门禁：绿（7/7）' : '门禁：—';
}
function clearAll(){
  clearTerm(); cur = -1; lineIdx = 0; status = {};
  renderTrack(); setStamp(); setGate('idle');
  noteText.textContent = '点「开始演示」，看一次改代码是怎么走完全流程的。';
}

function goto(i){
  if(i < 0 || i >= STEPS.length) return;
  clearTerm();
  cur = i; lineIdx = 0;
  status = {};
  // 之前的阶段标记为完成 / 失败
  for(let k=0;k<i;k++) status[STEPS[k].id] = STEPS[k].kind;
  renderTrack(); setStamp();
  noteText.textContent = STEPS[i].note;
  const st = STEPS[i];
  if(st.id==='gate1'||st.id==='regate') setGate('red');
  if(st.id==='green') setGate('green');
  // 该步之前的输出一次性铺上（作为"已发生的历史"）
  for(let k=0;k<i;k++){
    const prev = STEPS[k];
    prev.lines.forEach(([kind,text])=>{
      const d = document.createElement('div');
      d.className = 'ln ' + kind; d.textContent = text; d.style.animation='none';
      term.appendChild(d);
    });
  }
  term.scrollTop = term.scrollHeight;
  streamStep();
}

function streamStep(){
  const st = STEPS[cur];
  if(!st) return;
  if(lineIdx >= st.lines.length){
    status[st.id] = st.kind;
    renderTrack();
    if(playing) timer = setTimeout(()=>{ playing && goto(cur+1); }, 700/speed);
    else { playing = false; $('#play').textContent = '▶ 继续'; }
    return;
  }
  const [kind, text] = st.lines[lineIdx++];
  appendLine(kind, text);
  const base = (kind==='cmd' ? 420 : 150) / speed;
  timer = setTimeout(streamStep, base);
}

function play(){
  if(playing){ pause(); return; }
  if(cur < 0 || cur >= STEPS.length-1 && lineIdx >= (STEPS[cur]?.lines.length||0)){
    clearAll(); cur = -1;
  }
  playing = true;
  $('#play').textContent = '❚❚ 暂停';
  if(cur < 0) { goto(0); } else { streamStep(); }
}
function pause(){
  playing = false; clearTimeout(timer);
  $('#play').textContent = '▶ 继续';
}
function next(){
  pause();
  if(cur < 0) { goto(0); return; }
  if(lineIdx < STEPS[cur].lines.length){
    // 先把本步剩余输出铺完
    while(lineIdx < STEPS[cur].lines.length){
      const [k,t] = STEPS[cur].lines[lineIdx++];
      appendLine(k,t);
    }
    status[STEPS[cur].id] = STEPS[cur].kind; renderTrack();
    return;
  }
  if(cur < STEPS.length-1) goto(cur+1);
}

/* ============ 主题 ============ */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t==='dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('demo-theme', t); }catch(e){}
}
const qTheme = new URLSearchParams(location.search).get('theme');   // ?theme=dark 强制指定
const saved = (()=>{ try{ return localStorage.getItem('demo-theme'); }catch(e){ return null; } })();
setTheme(qTheme || saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = ()=> setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');

/* ============ 绑定 ============ */
$('#play').onclick = play;
$('#next').onclick = next;
$('#reset').onclick = ()=>{ pause(); clearAll(); $('#play').textContent='▶ 开始演示'; };
document.querySelectorAll('#speed button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#speed button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); speed = +b.dataset.s;
  };
});
document.addEventListener('keydown', e=>{
  if(e.key===' '){ e.preventDefault(); play(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  if(e.key==='r'||e.key==='R'){ pause(); clearAll(); }
});

/* 初始化 */
clearAll();
if(new URLSearchParams(location.search).has('auto')) setTimeout(play, 400);
</script>
</body>
</html>
