<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>番茄时钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="mode" id="mode">专注</div>

    <div class="ring">
      <svg viewBox="0 0 220 220">
        <circle class="bg" cx="110" cy="110" r="96"></circle>
        <circle class="fg" id="progress" cx="110" cy="110" r="96"></circle>
      </svg>
      <div class="time" id="timer">25:00</div>
    </div>

    <div class="durations">
      <label>工作 <input id="work-minutes" type="number" min="1" max="180" value="25"> 分</label>
      <label>休息 <input id="break-minutes" type="number" min="1" max="180" value="5"> 分</label>
    </div>

    <div class="controls">
      <button id="toggle" class="primary">开始</button>
      <button id="reset">重置</button>
    </div>

    <div class="hint" id="hint"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
