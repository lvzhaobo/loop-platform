<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交付工场 · 多智能体流水线可视化</title>
<style>
  :root{
    --floor:#efe6d6; --floor2:#e7dcc8; --wall:#dfeaf5; --sky1:#bfe0f5; --sky2:#e8f4fb;
    --desk:#b98d5f; --desk-d:#9c7248; --desk-l:#caa477; --ink:#5b4636;
    --card:#fffdf8; --line:#d8cbb4; --tag:#fffdf8; --muted:#9a8b72;
    --c-cto:#e0524a; --c-pl:#8b5cf6; --c-pm:#14b8a6; --c-req:#f0a500;
    --c-fe:#3b82f6; --c-be:#2563eb; --c-qa:#22a06b; --c-dis:#f2732e;
    --ok:#22a06b; --warn:#f0a500; --err:#e0524a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:var(--floor);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  /* ---------- top header card ---------- */
  .topband{position:relative; height:150px; flex:0 0 150px;
    background:linear-gradient(180deg,#f3ead9 0%, #dfeaf5 55%, #cfe3f2 100%);}
  .header{position:absolute; top:22px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; background:var(--card);
    border:2px solid #efe4cf; border-radius:20px; padding:12px 22px;
    box-shadow:0 10px 24px rgba(120,90,50,.14); z-index:5;}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#5b8cff);
    color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;letter-spacing:.5px}
  .htitle{font-size:20px;font-weight:800;letter-spacing:.3px}
  .clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:700;
    background:#f4eee1;border-radius:10px;padding:6px 12px;border:1px solid #e6dcc6}
  .pill{font-size:12px;font-weight:800;border-radius:999px;padding:7px 14px;letter-spacing:.5px}
  .pill.on{background:#d8f3df;color:#1c7a45}
  .pill.work{background:#fbeecb;color:#9a6b09}
  .windows{position:absolute;bottom:0;left:0;right:0;height:96px;display:flex;justify-content:center;gap:56px}
  .win{width:150px;height:88px;border:6px solid #7a5c3f;border-radius:6px;
    background:linear-gradient(160deg,var(--sky2),var(--sky1));position:relative;overflow:hidden}
  .win:before,.win:after{content:"";position:absolute;background:rgba(255,255,255,.6);border-radius:8px}
  .win:before{width:46px;height:14px;top:16px;left:16px}
  .win:after{width:40px;height:12px;top:44px;left:70px}
  .win i{position:absolute;top:0;left:50%;width:6px;height:100%;background:#7a5c3f;transform:translateX(-50%)}
  .win b{position:absolute;left:0;top:50%;width:100%;height:6px;background:#7a5c3f;transform:translateY(-50%)}

  /* ---------- main split ---------- */
  .main{flex:1; display:flex; min-height:0}
  .office{flex:1; position:relative; overflow:auto; padding:26px 26px 40px;
    background:
      repeating-linear-gradient(90deg,transparent 0 78px,rgba(0,0,0,.03) 78px 79px),
      var(--floor);}
  .zones{display:grid;grid-template-columns:0.9fr 1.2fr 1.2fr;gap:22px;min-width:920px}
  .zone{border:2px dashed #cbb89c;border-radius:22px;padding:16px 14px 22px;position:relative;min-height:420px}
  .zlabel{display:flex;align-items:center;gap:8px;justify-content:center;
    font-weight:800;letter-spacing:3px;font-size:13px;color:#7c6a52;margin-bottom:14px;text-transform:uppercase}
  .desks{display:flex;flex-wrap:wrap;gap:26px 30px;justify-content:center;align-items:flex-start}

  /* ---------- desk ---------- */
  .desk{width:150px;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .2s}
  .bubble{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%) scale(.9);
    background:#fff;border:1.5px solid #e7dcc6;border-radius:12px;padding:6px 10px;font-size:11px;
    white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 14px rgba(120,90,50,.16);
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;font-family:ui-monospace,Menlo,monospace;color:#4a3a2a;z-index:6}
  .bubble:after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#fff}
  .desk.talk .bubble{opacity:1;transform:translateX(-50%) scale(1)}
  .avatarwrap{position:relative;z-index:3}
  .monitor{width:66px;height:52px;background:#3a3630;border-radius:10px;border:3px solid #2a2722;
    display:grid;place-items:center;margin-bottom:-16px;box-shadow:inset 0 0 0 2px #4c473f}
  .monitor span{font-size:22px;filter:grayscale(.1)}
  .avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;
    background:#f3ead9;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.12);position:relative}
  .dot{position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#bdbdbd;border:2px solid #fff}
  .desk.online .dot{background:#37c26b}
  .desk.working .dot{background:var(--warn);animation:blink .8s infinite}
  .desk.done .dot{background:#37c26b}
  @keyframes blink{50%{opacity:.35}}
  .body{width:70px;height:40px;border-radius:22px 22px 0 0;margin-top:-6px;z-index:2;box-shadow:0 4px 8px rgba(0,0,0,.08)}
  .table{width:150px;height:34px;background:linear-gradient(180deg,var(--desk-l),var(--desk));
    border-radius:12px;position:relative;box-shadow:0 8px 0 var(--desk-d), 0 14px 16px rgba(90,60,30,.18);margin-top:-4px}
  .legs{width:150px;display:flex;justify-content:space-between;padding:0 14px}
  .legs i{width:9px;height:26px;background:var(--desk-d);border-radius:0 0 4px 4px}
  .nametag{margin-top:12px;background:var(--tag);border:1.5px solid #ece1cb;border-radius:999px;
    padding:4px 12px;font-size:12px;font-weight:700;box-shadow:0 3px 6px rgba(120,90,50,.12);white-space:nowrap}
  .prog{width:120px;height:6px;background:#e9ddc6;border-radius:99px;margin-top:8px;overflow:hidden;opacity:.0;transition:opacity .2s}
  .desk.working .prog,.desk.done .prog{opacity:1}
  .prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd27a,#f2732e);transition:width .25s}
  .desk.done .prog i{background:linear-gradient(90deg,#7fe0a6,#22a06b)}
  .desk.working{transform:translateY(-3px)}
  .desk.working .avatar{animation:bob .5s ease-in-out infinite;box-shadow:0 0 0 4px rgba(240,165,0,.18),0 4px 10px rgba(0,0,0,.12)}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .badge{position:absolute;top:-6px;left:-6px;font-size:16px;opacity:0;transform:scale(.5);transition:.2s;z-index:7}
  .desk.done .badge{opacity:1;transform:scale(1)}

  /* handoff flash line */
  .flash{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#f2732e,transparent);
    border-radius:2px;opacity:0;z-index:1}

  /* ---------- console ---------- */
  .console{width:380px;flex:0 0 380px;background:#1f1b16;color:#e8e0d0;display:flex;flex-direction:column;
    border-left:4px solid #2c2620}
  .ctop{padding:14px 16px;border-bottom:1px solid #332d25;display:flex;align-items:center;gap:10px}
  .ctop h3{margin:0;font-size:14px;letter-spacing:.5px;flex:1}
  .btn{border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer}
  .btn.go{background:#f2732e;color:#fff}
  .btn.go:hover{filter:brightness(1.08)}
  .btn.ghost{background:#332d25;color:#e8e0d0}
  .btn:disabled{opacity:.45;cursor:default}
  .speed{display:flex;gap:4px;margin-left:6px}
  .speed b{font-size:11px;background:#332d25;border-radius:7px;padding:6px 9px;cursor:pointer;color:#cdbfa6}
  .speed b.on{background:#f2732e;color:#fff}
  /* stage tracker */
  .stages{display:flex;gap:6px;padding:12px 14px;flex-wrap:wrap;border-bottom:1px solid #332d25}
  .stage{font-size:11px;padding:5px 9px;border-radius:8px;background:#2a251f;color:#8f8674;font-weight:700;
    display:flex;align-items:center;gap:5px}
  .stage.active{background:#f0a500;color:#231c10;box-shadow:0 0 0 2px rgba(240,165,0,.25)}
  .stage.done{background:#1c5c3a;color:#c7f2d8}
  /* log */
  .log{flex:1;overflow:auto;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7}
  .row{display:flex;gap:8px;opacity:0;transform:translateX(8px);animation:in .18s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .row .t{color:#6f6656;flex:0 0 62px}
  .row .who{font-weight:800;flex:0 0 74px}
  .row .msg{flex:1;color:#d9d0bf}
  .row.ok .msg{color:#8fe3b0}
  .row.warn .msg{color:#ffcf7a}
  .row.err .msg{color:#ff9a90}
  .cursor:after{content:"▍";animation:blink .8s steps(1) infinite;color:#f2732e}
  /* preview card */
  .preview{margin:12px 14px;padding:14px;border-radius:12px;background:#14100c;border:1px solid #3a3226;display:none}
  .preview.show{display:block;animation:pop .3s}
  @keyframes pop{from{transform:scale(.9);opacity:0}}
  .preview .h{font-size:12px;color:#8fe3b0;font-weight:800;margin-bottom:8px}
  .preview a{color:#ffd27a;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;text-decoration:none}
  .preview a:hover{text-decoration:underline}
  .preview .meta{font-size:11px;color:#8f8674;margin-top:8px}
  @media(max-width:960px){.main{flex-direction:column}.console{width:100%;flex:1}}
</style>
</head>
<body>
  <div class="topband">
    <div class="header">
      <div class="logo">AI</div>
      <div>
        <div class="htitle">AI 交付工场</div>
        <div style="font-size:11px;color:#a99a80">飞书需求 → 生成 → 验收 → 发布 → ECS 上线</div>
      </div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="pill on"><span id="online">0</span> ONLINE</div>
      <div class="pill work"><span id="working">0</span> WORKING</div>
    </div>
    <div class="windows">
      <div class="win"><i></i><b></b></div><div class="win"><i></i><b></b></div>
      <div class="win"><i></i><b></b></div><div class="win"><i></i><b></b></div>
    </div>
  </div>

  <div class="main">
    <div class="office">
      <div class="zones" id="zones"></div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="console">
      <div class="ctop">
        <h3>🖥️ 交付控制台</h3>
        <button class="btn go" id="run">▶ 开始交付</button>
        <button class="btn ghost" id="replay" style="display:none">↻ 重播</button>
        <div class="speed" id="speed">
          <b data-s="1.6">0.5×</b><b data-s="1" class="on">1×</b><b data-s="0.5">2×</b><b data-s="0.25">4×</b>
        </div>
      </div>
      <div class="stages" id="stages"></div>
      <div class="log" id="log"></div>
      <div class="preview" id="preview">
        <div class="h">🎉 已上线，公网可预览</div>
        <a id="purl" href="#" target="_blank">http://<your-server-ip>:1002/</a>
        <div class="meta" id="pmeta"></div>
      </div>
    </div>
  </div>

<script>
/* ============ 数据：智能体 + 流水线阶段（贴合真实交付链路） ============ */
const AGENTS = {
  cto:  {name:"CTO",          emoji:"👨‍💼", color:"var(--c-cto)", zone:"mng"},
  pl:   {name:"Product Lead", emoji:"🧑‍💼", color:"var(--c-pl)",  zone:"mng"},
  pm:   {name:"PM",           emoji:"🧑‍💻", color:"var(--c-pm)",  zone:"pd"},
  req:  {name:"Req Team",     emoji:"🔍",   color:"var(--c-req)", zone:"pd"},
  fe:   {name:"Frontend",     emoji:"🎨",   color:"var(--c-fe)",  zone:"dev"},
  be:   {name:"Backend",      emoji:"⚙️",   color:"var(--c-be)",  zone:"dev"},
  qa:   {name:"QA",           emoji:"✅",   color:"var(--c-qa)",  zone:"dev"},
  dis:  {name:"Dispatcher",   emoji:"🚀",   color:"var(--c-dis)", zone:"dev"},
};
const ZONES = [
  {id:"mng", label:"MANAGEMENT",     icon:"🗂️", members:["cto","pl"]},
  {id:"pd",  label:"PRODUCT & DESIGN",icon:"🎨", members:["pm","req"]},
  {id:"dev", label:"DEVELOPMENT",    icon:"💻", members:["fe","be","qa","dis"]},
];
// 每个阶段：负责 agent + 若干“刷刷刷”微步骤（bubble 文案 / 日志 / 级别）
const PIPELINE = [
  {stage:"需求", who:"pm", steps:[
    ["连接飞书开放平台…","连接 open.feishu.cn（tenant_access_token）"],
    ["解析 Wiki 节点…","wiki/v2 get_node：node_token → obj_token"],
    ["读取需求正文…","docx raw_content 拉取成功（1.2 KB）"],
    ["需求入队 FS-001","需求 FS-001《在线教育平台》已入队",'ok'],
  ]},
  {stage:"规格", who:"req", steps:[
    ["归一化需求…","清洗 / 分句 / 去噪"],
    ["匹配用例 case…","命中 case = education"],
    ["生成契约约束…","写出 constraints：颜色/标记/字段"],
    ["锁定验收标准","锁定 20 项 checklist，交付基线就绪",'ok'],
  ]},
  {stage:"编排", who:"cto", steps:[
    ["评估任务…","CTO 评估：real 模式（DeepSeek）"],
    ["Product Lead 复核…","PL 复核范围：列表 + 详情 + 报名"],
    ["下发工单","派单 → Frontend / Backend 并行开工",'ok'],
  ]},
  {stage:"前端", who:"fe", steps:[
    ["templates/base.html","布局骨架 + 导航"],
    ["templates/index.html","课程列表：course-card ×N"],
    ["templates/detail.html","详情页：btn-enroll / course-outline"],
    ["static/css/style.css","响应式 CSS Grid 生成（182 行）",'ok'],
  ]},
  {stage:"后端", who:"be", steps:[
    ["app.py 路由 /","首页列表路由"],
    ["/course/<id>","详情路由 + 404 兜底"],
    ["装载样例数据…","注入课程数据 8 条"],
    ["requirements.txt","Flask 依赖锁定",'ok'],
  ]},
  {stage:"验收", who:"qa", steps:[
    ["运行 verify.py…","启动 20 项确定性校验"],
    ["CSS 配色校验…","#1a73e8 / #34a853 命中 ✓"],
    ["内联样式 ≤ 2 …","检出 3 处内联 style ✗",'err'],
    ["回退修复中…","反馈重试：改用外链 class（19/20）",'warn'],
    ["复检…","内联样式 0 处 ✓"],
    ["20 / 20 PASS","验收全绿：20/20，确定性通过 ✅",'ok'],
  ]},
  {stage:"发布", who:"dis", steps:[
    ["克隆 loop-sample…","git clone lvzhaobo/loop-sample"],
    ["计算目录序号…","B 方案自动递增 → sample2"],
    ["提交并推送…","push main @ 73b29b1"],
    ["部署 ECS…","SSH <your-server-ip> → pip install"],
    ["拉起服务…","PORT=1002 nohup python3 app.py"],
    ["探活…","curl → HTTP 200 ✓"],
    ["上线完成","http://<your-server-ip>:1002/ 🎉",'ok'],
  ]},
];

/* ============ 渲染办公室 ============ */
const zonesEl = document.getElementById('zones');
const deskEls = {};
ZONES.forEach(z=>{
  const zi = document.createElement('div');
  zi.className='zone';
  zi.innerHTML = `<div class="zlabel">${z.icon} ${z.label}</div>`;
  const dk = document.createElement('div'); dk.className='desks';
  z.members.forEach(id=>{
    const a = AGENTS[id];
    const d = document.createElement('div');
    d.className='desk online'; d.id='desk-'+id;
    d.innerHTML = `
      <div class="bubble" id="bub-${id}"></div>
      <div class="badge">✅</div>
      <div class="avatarwrap">
        <div class="monitor"><span>🖥️</span></div>
        <div class="avatar">${a.emoji}<div class="dot"></div></div>
      </div>
      <div class="body" style="background:${a.color}"></div>
      <div class="table"></div>
      <div class="legs"><i></i><i></i></div>
      <div class="nametag">${a.name}</div>
      <div class="prog"><i id="prog-${id}"></i></div>`;
    dk.appendChild(d); deskEls[id]=d;
  });
  zi.appendChild(dk); zonesEl.appendChild(zi);
});

/* stage tracker */
const stagesEl = document.getElementById('stages');
const stageEls = PIPELINE.map((p,i)=>{
  const s=document.createElement('div'); s.className='stage'; s.textContent=(i+1)+' '+p.stage;
  stagesEl.appendChild(s); return s;
});

/* ============ 运行时 ============ */
const logEl=document.getElementById('log');
let SPEED=1, running=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
function now(){const d=new Date();return d.toTimeString().slice(0,8);}
function setCount(){
  document.getElementById('online').textContent=Object.keys(AGENTS).length;
  const w=document.querySelectorAll('.desk.working').length;
  document.getElementById('working').textContent=w;
}
function addLog(who,msg,lvl){
  const a=AGENTS[who];
  const r=document.createElement('div'); r.className='row '+(lvl||'');
  r.innerHTML=`<span class="t">${now()}</span><span class="who" style="color:${a.color}">${a.name}</span><span class="msg">${msg}</span>`;
  logEl.appendChild(r); logEl.scrollTop=logEl.scrollHeight;
}
function bubble(id,text){
  const d=deskEls[id], b=document.getElementById('bub-'+id);
  b.textContent=text; d.classList.add('talk');
}

async function typeBubble(id,text){
  const b=document.getElementById('bub-'+id);
  deskEls[id].classList.add('talk');
  b.classList.add('cursor');
  b.textContent='';
  for(let i=0;i<text.length;i++){ b.textContent=text.slice(0,i+1); await sleep(14); }
  b.classList.remove('cursor');
}

async function handoff(fromId,toId){
  const fl=document.getElementById('flash');
  const a=deskEls[fromId].getBoundingClientRect();
  const b=deskEls[toId].getBoundingClientRect();
  const off=document.querySelector('.office').getBoundingClientRect();
  const x1=a.left-off.left+a.width/2, x2=b.left-off.left+b.width/2;
  const y=Math.min(a.top,b.top)-off.top+30+document.querySelector('.office').scrollTop;
  fl.style.left=Math.min(x1,x2)+'px'; fl.style.top=y+'px'; fl.style.width=Math.abs(x2-x1)+'px';
  fl.style.transition='none'; fl.style.opacity='1';
  await sleep(30);
  fl.style.transition='opacity .5s'; fl.style.opacity='0';
}

async function runStage(p,idx){
  const id=p.who, d=deskEls[id], prog=document.getElementById('prog-'+id);
  stageEls[idx].className='stage active';
  d.classList.remove('done'); d.classList.add('working'); setCount();
  addLog(id,`▶ 进入「${p.stage}」阶段`);
  const n=p.steps.length;
  for(let i=0;i<n;i++){
    const [bub,msg,lvl]=p.steps[i];
    await typeBubble(id,bub);
    addLog(id,msg,lvl);
    prog.style.width=Math.round((i+1)/n*100)+'%';
    await sleep(260);
  }
  d.classList.remove('working'); d.classList.add('done','talk');
  document.getElementById('bub-'+id).textContent='完成 ✔';
  stageEls[idx].className='stage done';
  setCount();
  // 交接到下一阶段
  if(idx<PIPELINE.length-1){ await sleep(120); await handoff(id,PIPELINE[idx+1].who); }
  await sleep(150);
  d.classList.remove('talk');
}

async function runAll(){
  if(running) return; running=true;
  document.getElementById('run').disabled=true;
  document.getElementById('replay').style.display='none';
  document.getElementById('preview').classList.remove('show');
  logEl.innerHTML=''; 
  Object.values(deskEls).forEach(d=>{d.className='desk online'; });
  stageEls.forEach(s=>s.className='stage');
  addLog('cto','===== 新一轮自主交付启动 =====');
  for(let i=0;i<PIPELINE.length;i++){ await runStage(PIPELINE[i],i); }
  // 完成
  addLog('dis','===== 交付完成，全链路绿灯 =====','ok');
  const pv=document.getElementById('preview'); pv.classList.add('show');
  document.getElementById('pmeta').textContent=`commit 73b29b1 · sample2 · 端口 1002 · 20/20 验收 · 用时 ${(Math.random()*8+22).toFixed(1)}s`;
  running=false;
  document.getElementById('run').disabled=false;
  document.getElementById('replay').style.display='inline-block';
}

/* ============ 交互 ============ */
document.getElementById('run').onclick=runAll;
document.getElementById('replay').onclick=runAll;
document.getElementById('speed').onclick=e=>{
  if(e.target.tagName!=='B')return;
  document.querySelectorAll('.speed b').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); SPEED=parseFloat(e.target.dataset.s);
};
// clock
