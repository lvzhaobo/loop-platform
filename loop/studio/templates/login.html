<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Loop Platform 工作台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #e2e8f0;
    }
    .card {
      width: 360px; max-width: 92vw; padding: 36px 32px;
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .brand { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #f8fafc; }
    .sub { font-size: 13px; color: #94a3b8; margin: 0 0 24px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
    input[type=password] {
      width: 100%; padding: 12px 14px; font-size: 15px; letter-spacing: 1px;
      background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9;
      outline: none; transition: border-color .15s;
    }
    input[type=password]:focus { border-color: #6366f1; }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 15px; font-weight: 600;
      background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4f46e5; }
    .err {
      margin-top: 16px; padding: 10px 12px; font-size: 13px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4);
      border-radius: 8px; color: #fca5a5;
    }
    .foot { margin-top: 22px; font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1 class="brand">Loop Platform 工作台</h1>
    <p class="sub">需求 → 编译规格 → 门禁 → 生成 → 验收 的可视化控制台</p>
    <label for="token">访问口令</label>
    <input id="token" name="token" type="password" autocomplete="current-password"
           placeholder="请输入访问口令" autofocus required>
    <button type="submit">进入工作台</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="foot">受口令保护 · 未授权访问将被拒绝</div>
  </form>
</body>
</html>
