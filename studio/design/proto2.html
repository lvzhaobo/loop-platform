<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>AI Coding 平台 · 原型 v13（真实模式可切）</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --card2:#fafbfe; --line:#e3e9f2; --line2:#eef2f8;
    --ink:#16202f; --muted:#5b6b82; --dim:#8a99ad;
    --blue:#2563eb; --bluebg:#eef4ff; --bluebd:#c7dbff;
    --green:#0f8a5f; --greenbg:#eefaf4; --greenbd:#b7e6d2;
    --red:#d13b46; --redbg:#fff2f3; --redbd:#f5c6ca;
    --amber:#b45309; --amberbg:#fff8ea; --amberbd:#f5d99b;
    --violet:#6d3fd1; --violetbg:#f4f0ff; --violetbd:#d9ccff;
    --cyan:#0e7490; --cyanbg:#ecfeff; --cyanbd:#a5f3fc;
    --shadow:0 10px 30px -22px rgba(22,32,47,.4);
  }
  [data-theme="dark"]{
    --bg:#0a0f1c; --card:#131c30; --card2:#0f1728; --line:#26324a; --line2:#1b2740;
    --ink:#e6edf7; --muted:#8fa3bf; --dim:#5b6d88;
    --blue:#60a5fa; --bluebg:#152641; --bluebd:#2a4a78;
    --green:#34d399; --greenbg:#0f2a22; --greenbd:#1f5c46;
    --red:#fb7185; --redbg:#2a1420; --redbd:#5c2434;
    --amber:#fbbf24; --amberbg:#2a2010; --amberbd:#5c4520;
    --violet:#a78bfa; --violetbg:#221a3d; --violetbd:#4a3a80;
    --cyan:#22d3ee; --cyanbg:#0b2b33; --cyanbd:#155e6b;
    --shadow:0 12px 34px -22px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:grid;grid-template-rows:52px 1fr;height:100vh;}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--card);
       border-bottom:1px solid var(--line);z-index:20;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;}
  .logo .m{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#6d3fd1);
           color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .proto{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--amber);
         border:1px solid var(--amberbd);background:var(--amberbg);border-radius:5px;padding:2px 6px;}
  .crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .crumb b{color:var(--ink);font-weight:800;}
  .sp{flex:1;}
  .env{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;}
  .iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);
           color:var(--ink);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{border-color:var(--blue);color:var(--blue);}
  .me{width:28px;height:28px;border-radius:50%;background:var(--bluebg);color:var(--blue);
      display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

  .shell{display:grid;grid-template-columns:216px 1fr;min-height:0;}
  /* ---------- 侧栏 ---------- */
  aside{background:var(--card);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;}
  aside::-webkit-scrollbar{width:5px;} aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .mlabel{font-size:9.5px;letter-spacing:.14em;color:var(--dim);font-weight:800;padding:8px 10px 5px;}
  .mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
      font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:1px;transition:.13s;}
  .mi:hover{background:var(--line2);color:var(--ink);}
  .mi.on{background:var(--bluebg);color:var(--blue);}
  .mi .n{width:18px;height:18px;border-radius:5px;background:var(--line2);color:var(--dim);
         font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .mi.on .n{background:var(--blue);color:#fff;}
  .mi .b{margin-left:auto;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:99px;
         background:var(--redbg);color:var(--red);}
  .mi .b.ok{background:var(--greenbg);color:var(--green);}
  .mi.off{opacity:.34;}
  .mi.lock{cursor:not-allowed;}
  .mi.lock:hover{background:transparent;color:var(--muted);}
  .mi .lockicon{margin-left:auto;font-size:9px;color:var(--dim);}
  .mi.on .lockicon{color:var(--blue);}
  .modebtn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);cursor:pointer;}
  .modebtn:hover{border-color:var(--blue);color:var(--blue);}
  .modebtn.real{border-color:var(--violetbd);background:var(--violetbg);color:var(--violet);}
  .mi.off:hover{opacity:.65;}

  /* ---------- 主体 ---------- */
  main{overflow:auto;padding:16px 20px 40px;min-height:0;}
  main::-webkit-scrollbar{width:8px;} main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .ph h1{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .ph p{font-size:12px;color:var(--muted);margin-top:3px;}
  .ph .sp{flex:1;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);}
  .card>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);}
  .card>header b{font-size:13px;font-weight:800;}
  .card>header .sp{flex:1;}
  .card>.body{padding:0;}

  .btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.13s;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.pri:hover{filter:brightness(1.08);color:#fff;}
  .btn.sm{padding:3px 9px;font-size:11px;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
  .btn.ghost:hover{background:var(--line2);color:var(--ink);}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{position:sticky;top:0;background:var(--card2);text-align:left;font-size:10.5px;font-weight:800;
           letter-spacing:.04em;color:var(--dim);padding:8px 12px;border-bottom:1px solid var(--line);z-index:2;}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;line-height:1.5;}
  tbody tr:hover{background:var(--card2);}
  tbody tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums;color:var(--dim);}
  td.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;}
  tr.grp td{background:var(--line2);font-size:10.5px;font-weight:800;letter-spacing:.06em;
            color:var(--muted);padding:5px 12px;}
  tr.grp:hover td{background:var(--line2);}
  tr.click{cursor:pointer;}
  tr.detail td{background:var(--card2);padding:0;}
  tr.detail .wrap{padding:10px 12px 12px 40px;border-left:3px solid var(--blue);}
  .caret{display:inline-block;width:12px;color:var(--dim);transition:.15s;font-size:9px;}
  .caret.open{transform:rotate(90deg);color:var(--blue);}
  tr.hi td{background:var(--bluebg)!important;}
tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--blue);}
  tr.hi-seen td{opacity:.55;}
  .player{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;}
  .pbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);
        color:var(--ink);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .pbtn:hover{border-color:var(--blue);color:var(--blue);}
  .pbtn.main{background:var(--blue);border-color:var(--blue);color:#fff;width:38px;height:38px;font-size:15px;}
  .pbtn.main:hover{filter:brightness(1.1);color:#fff;}
  .ptrack{flex:1;min-width:180px;height:8px;border-radius:4px;background:var(--line2);position:relative;cursor:pointer;}
  .ptrack i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2563eb,#6d3fd1);width:0;transition:width .18s;}
  .ptrack b{position:absolute;top:-3px;width:2px;height:14px;background:var(--amber);opacity:.7;}
  .ptime{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700;}
  .pnow{font-size:11.5px;color:var(--muted);min-width:260px;}
  .pnow b{color:var(--ink);}

  .pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
        padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap;}
  .p-ok{color:var(--green);border-color:var(--greenbd);background:var(--greenbg);}
  .p-warn{color:var(--amber);border-color:var(--amberbd);background:var(--amberbg);}
  .p-bad{color:var(--red);border-color:var(--redbd);background:var(--redbg);}
  .p-info{color:var(--blue);border-color:var(--bluebd);background:var(--bluebg);}
  .p-vio{color:var(--violet);border-color:var(--violetbd);background:var(--violetbg);}
  .p-cyan{color:var(--cyan);border-color:var(--cyanbd);background:var(--cyanbg);}
  .p-gray{color:var(--dim);border-color:var(--line);background:var(--line2);}

  .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:60px;}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--blue);}
  .bar i.g{background:var(--green);} .bar i.a{background:var(--amber);} .bar i.r{background:var(--red);}

  /* ---------- 抽屉 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(8,14,26,.4);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:520px;background:var(--card);border-left:1px solid var(--line);
          transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column;}
  .drawer.on{transform:none;}
  .drawer header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .drawer header b{font-size:13.5px;}
  .drawer .dbody{padding:14px 16px;overflow:auto;flex:1;font-size:12px;line-height:1.7;}
  .drawer .dbody::-webkit-scrollbar{width:6px;} .drawer .dbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin-bottom:12px;font-size:11.5px;}
  .kv .k{color:var(--dim);font-weight:700;}
  .pre{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;
       font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.65;white-space:pre-wrap;color:var(--muted);}
  .note{border-left:3px solid var(--blue);background:var(--bluebg);padding:9px 12px;border-radius:0 8px 8px 0;
        font-size:11.5px;line-height:1.6;margin:10px 0;}
  .note.warn{border-left-color:var(--amber);background:var(--amberbg);}
  .note.bad{border-left-color:var(--red);background:var(--redbg);}
  .note.ok{border-left-color:var(--green);background:var(--greenbg);}

  /* ---------- 通用网格 ---------- */
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .kpi{padding:13px 15px;}
  .kpi .l{font-size:10.5px;color:var(--dim);font-weight:800;letter-spacing:.06em;}
  .kpi .v{font-size:24px;font-weight:800;margin:5px 0 2px;font-variant-numeric:tabular-nums;}
  .kpi .d{font-size:11px;color:var(--muted);}
  .funnel{display:flex;gap:6px;align-items:flex-end;padding:14px;}
  .funnel .st{flex:1;text-align:center;}
  .funnel .st .bx{border-radius:8px 8px 0 0;background:var(--bluebg);border:1px solid var(--bluebd);
                  border-bottom:none;display:flex;align-items:center;justify-content:center;
                  font-size:18px;font-weight:800;color:var(--blue);}
  .funnel .st .lb{font-size:10px;color:var(--muted);font-weight:700;margin-top:5px;}

  /* 真实日志块 */
  .termlog{background:#0e1626;border-radius:9px;padding:11px 14px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;line-height:1.85;color:#c9d6e8;white-space:pre-wrap;word-break:break-word;position:relative;}
  .termlog .tag{position:absolute;right:9px;top:7px;font-size:9px;color:#6b7f9c;font-weight:800;letter-spacing:.1em;}
  .termlog .ok{color:#5eead4;} .termlog .bad{color:#fb7185;} .termlog .warn{color:#fbbf24;}
  .termlog .dim{color:#6b7f9c;} .termlog .k{color:#7dd3fc;} .termlog .hl{background:#3a1d28;border-radius:3px;}
  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .vbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);}
  .vbox.bad{border-color:var(--redbd);background:var(--redbg);}
  .vbox.good{border-color:var(--greenbd);background:var(--greenbg);}
  .vbox .vt{font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:6px;}
  .vbox .vn{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}

  /* FAQ */
  .faqsearch{display:flex;gap:9px;align-items:center;margin-bottom:12px;}
  .faqsearch input{flex:1;padding:9px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:12.5px;font-family:inherit;outline:none;}
  .faqsearch input:focus{border-color:var(--blue);}
  .fg{margin-bottom:14px;}
  .fg>h3{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim);
    margin:0 0 7px;display:flex;align-items:center;gap:8px;}
  .fg>h3::after{content:"";flex:1;height:1px;background:var(--line2);}
  details.q{border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:6px;overflow:hidden;}
  details.q[open]{border-color:var(--bluebd);}
  details.q summary{padding:10px 13px;cursor:pointer;font-size:12.5px;font-weight:700;
    list-style:none;display:flex;align-items:flex-start;gap:9px;}
  details.q summary::-webkit-details-marker{display:none;}
  details.q summary::before{content:"▸";color:var(--dim);font-size:10px;margin-top:3px;flex:none;transition:.15s;}
  details.q[open] summary::before{transform:rotate(90deg);color:var(--blue);}
  details.q[open] summary{background:var(--bluebg);}
  details.q .a{padding:10px 13px 12px 31px;font-size:11.5px;line-height:1.75;color:var(--muted);
    border-top:1px solid var(--line2);}
  details.q .a b{color:var(--ink);}
  details.q .a code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:var(--line2);
    border-radius:4px;padding:1px 5px;color:var(--ink);}
  details.q .a .tagline{margin-top:6px;}
  .fcount{font-size:11px;color:var(--dim);}

  /* 上手类页面 */
  .stepper{display:flex;flex-direction:column;gap:10px;}
  .stp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);}
  .stp.hd{background:var(--card2);border-style:dashed;}
  .stp .no{display:inline-flex;width:22px;height:22px;border-radius:6px;background:#16202f;color:#fff;
           font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;flex:none;}
  .stp .hdrow{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .stp .ttl{font-size:13px;font-weight:800;}
  .stp .why{font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:8px;}
  .cbblk{background:#0e1626;border-radius:8px;padding:9px 12px;font-family:ui-monospace,Menlo,monospace;
         font-size:11px;line-height:1.7;color:#c9d6e8;white-space:pre-wrap;word-break:break-word;position:relative;}
  .cbblk .tag{position:absolute;right:8px;top:6px;font-size:9px;color:#6b7f9c;font-weight:800;letter-spacing:.1em;}
  .cbblk .c{color:#6b7f9c;} .cbblk .k{color:#7dd3fc;} .cbblk .s{color:#fbbf24;} .cbblk .g{color:#5eead4;}
  .expect{font-size:11px;color:var(--green);margin-top:6px;font-family:ui-monospace,Menlo,monospace;}
  .four{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* 技术透视悬浮栏 */
  .techbtn{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:75;
    writing-mode:vertical-rl;letter-spacing:.18em;font-size:10.5px;font-weight:800;
    padding:14px 7px;border-radius:10px 0 0 10px;border:1px solid var(--line);border-right:none;
    background:var(--card);color:var(--muted);cursor:pointer;font-family:inherit;
    box-shadow:-6px 0 20px -14px rgba(0,0,0,.5);transition:.16s;}
  .techbtn:hover{color:var(--blue);border-color:var(--bluebd);}
  .techbtn.open{opacity:0;pointer-events:none;}
  
  .techpane{position:fixed;right:0;top:52px;bottom:0;width:420px;z-index:70;
    background:var(--card);border-left:1px solid var(--line);
    box-shadow:-16px 0 44px -28px rgba(22,32,47,.45);
    transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;}
  .techpane.on{transform:none;}
  .techpane.wide{width:620px;}
  .techpane header{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex:none;}
  .techpane header b{font-size:12.5px;}
  .techpane .tabs2{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line2);flex:none;}
  .techpane .tabs2 button{padding:6px 10px;border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:none;
    background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .techpane .tabs2 button.on{background:var(--card2);border-color:var(--line);color:var(--ink);margin-bottom:-1px;}
  .techpane .tbody{flex:1;overflow:auto;padding:12px 14px 20px;}
  .techpane .tbody::-webkit-scrollbar{width:6px;}
  .techpane .tbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .tp-sec{margin-bottom:14px;}
  .tp-sec .h{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--dim);margin-bottom:6px;
    display:flex;align-items:center;gap:6px;}
  .tp-sec .h::after{content:"";flex:1;height:1px;background:var(--line2);}
  .tp-note{font-size:11.5px;line-height:1.75;color:var(--muted);}
  .tp-note b{color:var(--ink);}
  .tp-api{display:flex;flex-direction:column;gap:4px;}
  .tp-api div{display:flex;gap:8px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;}
  .tp-m{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;flex:none;}
  .tp-flow{display:flex;flex-direction:column;gap:0;}
  .tp-flow div{display:flex;gap:8px;font-size:11px;color:var(--muted);padding:3px 0;}
  .tp-flow div span:first-child{color:var(--blue);font-weight:800;flex:none;width:16px;}
  .tp-code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.65;
    background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
    white-space:pre-wrap;word-break:break-word;overflow-x:auto;color:#334155;}
  [data-theme="dark"] .tp-code{color:#c9d6e8;}
  .tp-link{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:5px 8px;border-radius:6px;
    cursor:pointer;color:var(--muted);border:1px solid transparent;}
  .tp-link:hover{background:var(--bluebg);color:var(--blue);border-color:var(--bluebd);}
  .tp-link .f{margin-left:auto;font-size:10px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;}

  /* 演示模式 */
  .tour{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0f172a;color:#e6edf7;
        transform:translateY(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);
        box-shadow:0 -14px 40px -20px rgba(0,0,0,.6);}
  .tour.on{transform:none;}
  .tour .in{display:flex;align-items:center;gap:16px;padding:12px 22px;max-width:1400px;margin:0 auto;}

function openDrawer(title, html){
  $('#dTitle').textContent = title;
  $('#dBody').innerHTML = html;
  $('#drawer').classList.add('on');
  $('#scrim').classList.add('on');
}
function closeDrawer(){
  $('#drawer').classList.remove('on');
  $('#scrim').classList.remove('on');
}

$('#scrim').onclick = closeDrawer;

const SEC = {
  'g-start':{t:'上手'},
  'g-work':{t:'工作'},
  'g-pipe':{t:'流水线'},
  'g-plat':{t:'平台配置'},
  'g-asset':{t:'资产与质量'}
};
function currentPage(){
  const h = (location.hash || '').replace('#/','').split('?')[0];
  return PAGES[h] ? h : 'mine';
}
function renderMenu(active){
  let html = '', last = '';
  MENU.forEach(m=>{
    if(m.sec !== last){
      html += `<div class="mlabel">${SEC[m.sec]?.t || ''}</div>`;
      last = m.sec;
    }
    const badge = m.badge ? `<span class="b ${m.badgeOk?'ok':''}">${m.badge}</span>` : '';
    const off = CUR_ROLE !== 'all' && !m.roles.includes(CUR_ROLE);
    const locked = MODE === 'real' && !REAL_PAGES.has(m.id);
    html += `<div class="mi ${m.id===active?'on':''} ${off?'off':''} ${locked?'lock':''}" data-go="${m.id}">
      <span class="n">${m.n || '·'}</span>${m.t}${badge}
      ${locked?'<span class="lockicon">🔒</span>':''}</div>`;
  });
  $('#menu').innerHTML = html;
  $('#menu').querySelectorAll('.mi').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.go;
      if(MODE === 'real' && !REAL_PAGES.has(id)){
        const m = MENU.find(x=>x.id===id);
        realToast(m ? m.t : id, id);
        return;
      }
      location.hash = '#/' + id;
    };
  });
}

/* ---------- ⑤ 执行 ---------- */
function orchPill(o, st){
  if(o==='det') return '<span class="pill p-cyan">● 确定性</span>';
  if(o==='gate') return '<span class="pill p-vio">闸 人批</span>';
  if(o==='mix' && st){
    const ag = st.steps.filter(x=>x.o==='agent').length;
    const de = st.steps.filter(x=>x.o==='det').length;
    const ga = st.steps.filter(x=>x.o==='gate').length;
    return `<span class="pill p-warn">◆${ag}</span><span class="pill p-cyan">●${de}</span>${ga?`<span class="pill p-vio">闸${ga}</span>`:''}`;
  }
  return '';
}
function runPane(tab){
  document.querySelectorAll('[data-rtab]').forEach(b=>{
    b.classList.toggle('pri', b.dataset.rtab === tab);
  });
  document.querySelectorAll('.rpane').forEach(p=>p.style.display = 'none');
  const el = document.getElementById('rp-' + tab);
  if(el) el.style.display = '';
  if(tab === 'code') renderDiff();
}

function renderDiff(){
  const box = document.getElementById('diffWrap');
  if(!box || box.dataset.done) return;
  box.dataset.done = '1';
  const files = Object.keys(DATA.diff);
  box.innerHTML = `
    <div style="display:grid;grid-template-columns:170px 1fr;min-height:340px">
      <div style="border-right:1px solid var(--line);padding:8px">
        ${files.map((f,i)=>`<div class="fitem ${i===0?'on':''}" data-df="${f}"
           style="padding:7px 9px;border-radius:7px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;cursor:pointer;color:${i===0?'var(--blue)':'var(--muted)'};${i===0?'background:var(--bluebg);font-weight:800':''}">
           <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:6px"></span>${f}</div>`).join('')}
      </div>
      <div id="diffBody" style="padding:10px 14px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7"></div>
    </div>`;
  const paint = (f)=>{
    document.querySelectorAll('[data-df]').forEach(el=>{
      const on = el.dataset.df === f;
      el.style.background = on ? 'var(--bluebg)' : '';
      el.style.color = on ? 'var(--blue)' : 'var(--muted)';
      el.style.fontWeight = on ? '800' : '';
    });
    document.getElementById('diffBody').innerHTML = DATA.diff[f].map(l=>{
      const c = l.startsWith('+') ? 'color:var(--green);background:var(--greenbg)'
             : l.startsWith('-') ? 'color:var(--red);background:var(--redbg)'
             : 'color:var(--muted)';
      return `<div style="${c};padding:0 6px;border-radius:3px;white-space:pre">${l.replace(/</g,'&lt;')}</div>`;
    }).join('');
  };
  box.querySelectorAll('[data-df]').forEach(el=>el.onclick = ()=> paint(el.dataset.df));
  paint(files[0]);
}

/* ==================== 时间轴播放器 ==================== */
const PLAY = {list:[], i:-1, timer:null, on:false};

function stepBase(n){ let k=0; for(const st of DATA.stages){ if(st.n===n) return k; k+=st.steps.length; } return k; }
function flatSteps(){ const o=[]; DATA.stages.forEach(st=>st.steps.forEach(x=>o.push({...x, stage:st.n, stageName:st.name}))); return o; }

function playerMount(){
  const host = document.getElementById('pPlay');
  if(!host) return;
  PLAY.list = flatSteps(); PLAY.i = -1; PLAY.on = false;
  document.getElementById('pPlay').onclick  = playerPlay;
  document.getElementById('pBack').onclick  = ()=>{ playerPause(); playerStep(-1); };
  document.getElementById('pFwd').onclick   = ()=>{ playerPause(); playerStep(1); };
  document.getElementById('pReset').onclick = playerReset;
  document.getElementById('pTrack').onclick = e=>{
    const r = e.currentTarget.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    playerPause();
    PLAY.i = Math.round(p * (PLAY.list.length - 1));
    playerRender();
  };
  paintTicks();
  playerRender();
}

function paintTicks(){
  const track = document.getElementById('pTrack');
  if(!track) return;
  const total = PLAY.list.length;
  let k = 0;
  DATA.stages.forEach(st=>{
    k += st.steps.length;
    const b = document.createElement('b');
    b.style.left = (k/total*100) + '%';
    b.title = st.name;
    track.appendChild(b);
  });
}

function playerRender(){
  const total = PLAY.list.length;
  const cnt = document.getElementById('pCount'); if(!cnt) return;
  cnt.textContent = Math.max(0, PLAY.i+1) + ' / ' + total;
  document.getElementById('pFill').style.width = ((PLAY.i+1)/total*100) + '%';

  const cur = PLAY.list[PLAY.i];
  const now = document.getElementById('pNow');
  if(!cur){ now.innerHTML = '点 ▶ 回放这一轮 —— 也可以手动点任意一行看详情'; }
  else {
    now.innerHTML = `<b>${cur.stageName}</b> · ${cur.t} · <span class="mono">${cur.act}</span> → ${cur.res}`;
  }

  document.querySelectorAll('[data-k]').forEach(el=>{
    const k = +el.dataset.k;
    el.classList.toggle('hi', k === PLAY.i);
    el.classList.toggle('hi-seen', k < PLAY.i);
  });
  document.querySelectorAll('[data-stage]').forEach(el=>{
    const on = cur && +el.dataset.stage === cur.stage;
    el.classList.toggle('hi', !!on);
  });

  if(cur){
    DATA.stages.forEach(st=>{
      const d = document.getElementById('d'+st.n), c = document.getElementById('c'+st.n);
      if(!d) return;
      const want = (st.n === cur.stage);
      d.style.display = want ? '' : 'none';
      if(c) c.classList.toggle('open', want);
    });
    const row = document.querySelector(`[data-k="${PLAY.i}"]`);
    if(row) row.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

function playerStep(d){
  if(PLAY.timer){ clearTimeout(PLAY.timer); PLAY.timer = null; }
  const before = PLAY.i;
  PLAY.i = Math.max(-1, Math.min(PLAY.list.length-1, PLAY.i + d));
  playerRender();
  const cur = PLAY.list[PLAY.i];
  if(cur && cur.o === 'gate' && d > 0 && before < PLAY.i){
    playerPause();
    const w = document.getElementById('pWait');
    if(w){ w.style.display = ''; }
    return true;
  }
  return false;
}

function playerPlay(){
  if(PLAY.on){ playerPause(); return; }
  const w = document.getElementById('pWait'); if(w) w.style.display = 'none';
  if(PLAY.i >= PLAY.list.length-1) PLAY.i = -1;
  PLAY.on = true;
  const b = document.getElementById('pPlay'); if(b) b.textContent = '❚❚';
  const tick = ()=>{
    if(!PLAY.on) return;
    const paused = playerStep(1);
    if(paused) return;
    if(PLAY.i >= PLAY.list.length-1){ playerPause(); return; }
    PLAY.timer = setTimeout(tick, +(document.getElementById('pSpeed')?.value || 700));
  };
  tick();
}

function playerPause(){
  PLAY.on = false;
  if(PLAY.timer){ clearTimeout(PLAY.timer); PLAY.timer = null; }
  const b = document.getElementById('pPlay'); if(b) b.textContent = '▶';
}

function playerApprove(){ const w = document.getElementById('pWait'); if(w) w.style.display='none'; playerPlay(); }
function playerReset(){
  playerPause();
  PLAY.i = -1;
  const w = document.getElementById('pWait'); if(w) w.style.display = 'none';
  playerRender();
}

        ${items.map(([q,a])=>`
          <details class="q" data-t="${(q+' '+a).replace(/<[^>]+>/g,'').toLowerCase()}">
            <summary>${q}</summary>
            <div class="a">${a}</div>
          </details>`).join('')}
      </div>`).join('')}
  </div>`;

function faqFilter(kw){
  const k = (kw||'').trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.fg').forEach(fg=>{
    let g = 0;
    fg.querySelectorAll('details.q').forEach(d=>{
      const hit = !k || d.dataset.t.includes(k);
      d.style.display = hit ? '' : 'none';
      if(hit) g++;
    });
    fg.style.display = g ? '' : 'none';
    n += g;
  });
  const el = document.getElementById('faqN');
  if(el) el.textContent = k ? `匹配 ${n} 条` : `共 ${n} 条`;
}

  document.getElementById('tSay').innerHTML = st.say;

  document.getElementById('tPrev').style.opacity = i === 0 ? '.45' : '1';
  document.getElementById('tNext').textContent = i === TOUR.length-1 ? '重新开始' : '下一步 →';
  setTimeout(()=>{ const v=document.getElementById('view'); if(v) v.scrollTop = 0; }, 30);
}

document.getElementById('tourBtn').onclick = ()=> tourOn ? tourStop() : tourStart();
document.getElementById('tExit').onclick = tourStop;
document.getElementById('tPrev').onclick = ()=> tourGo(TI-1);
document.getElementById('tNext').onclick = ()=> tourGo(TI === TOUR.length-1 ? 0 : TI+1);
document.addEventListener('keydown', e=>{
  if(!tourOn) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); tourGo(TI+1); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); tourGo(TI-1); }
  if(e.key === 'Escape'){ tourStop(); }
});
