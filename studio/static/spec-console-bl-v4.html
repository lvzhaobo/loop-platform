<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百炼Chatbot — Spec 14文档三环追溯</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f2f5;--card:#fff;--card-border:#dee2e6;--text:#2c3e50;--text-sec:#495057;
  --toolbar-bg:#fff;--toolbar-border:#e0e0e0;--tooltip-bg:#333;--tooltip-text:#fff;
  --dim-opacity:.15;--hover-bg:#e3f2fd;--active-color:#1e88e5;
  --shadow-sm:0 2px 8px rgba(0,0,0,.08);--shadow-md:0 4px 20px rgba(0,0,0,.15);
  --sidebar-bg:#fafbfc;--sidebar-border:#e5e7eb;--sidebar-hover:#eef3fb;
  --green:#4caf50;--red:#ef5350;--orange:#ff9800;--blue:#1e88e5;--purple:#8e24aa;
  --phase-meta:#78909c;--phase-proposal:#5c6bc0;--phase-spec:#43a047;
  --phase-design:#1e88e5;--phase-plan:#fb8c00;--phase-test:#e53935;--phase-trace:#8e24aa;
}
.dark{
  --bg:#1a1a2e;--card:#16213e;--card-border:#2a3a5c;--text:#e0e0e0;--text-sec:#b0b0b0;
  --toolbar-bg:#0f3460;--toolbar-border:#1a1a4e;--tooltip-bg:#0f3460;--tooltip-text:#e0e0e0;
  --sidebar-bg:#0c1a35;--sidebar-border:#1a2744;--sidebar-hover:#14254a;
}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;transition:background .3s,color .3s}

/* Toolbar */
.toolbar{position:fixed;top:0;left:0;right:0;height:46px;background:var(--toolbar-bg);border-bottom:1px solid var(--toolbar-border);display:flex;align-items:center;padding:0 12px;z-index:100;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.toolbar .brand{display:flex;align-items:center;gap:6px;padding-right:8px;border-right:1px solid var(--toolbar-border);font-size:12px;font-weight:700;color:var(--text);white-space:nowrap}
.toolbar .brand-logo{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--blue),#1565c0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.toolbar .crumb{font-size:11px;color:var(--text-sec);white-space:nowrap}
.toolbar .sep{width:1px;height:20px;background:var(--toolbar-border);margin:0 4px}
.toolbar .spacer{flex:1}
.btn{padding:4px 10px;border-radius:5px;border:1px solid var(--card-border);background:var(--card);cursor:pointer;font-size:11px;color:var(--text-sec);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--hover-bg);border-color:var(--active-color)}
.btn.active{background:var(--active-color);color:#fff;border-color:var(--active-color)}
.btn-icon{padding:4px 6px;font-size:13px}

/* 三栏布局 */
.left-panel{position:fixed;top:46px;left:0;bottom:0;width:280px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);z-index:90;overflow-y:auto;font-size:12px}
.left-panel::-webkit-scrollbar{width:4px}
.left-panel::-webkit-scrollbar-thumb{background:#d0d4d9;border-radius:2px}
.main-area{position:fixed;top:46px;left:280px;right:0;bottom:0;overflow:hidden}
.canvas-wrap{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.canvas-wrap.panning{cursor:grabbing}
.canvas{position:relative;transform-origin:0 0}
.canvas svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* 左侧面板样式 */
.lp-section{border-bottom:1px solid var(--sidebar-border)}
.lp-section:last-child{border-bottom:none}
.lp-title{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#9aa0a6;padding:10px 14px 6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.lp-title .lp-icon{font-size:12px}
.lp-role{padding:2px 0}
.lp-role-header{display:flex;align-items:center;gap:6px;padding:5px 14px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text);transition:all .12s}
.lp-role-header:hover{background:var(--sidebar-hover)}
.lp-role-caret{font-size:8px;color:#bbb;transition:transform .15s;width:10px}
.lp-role.collapsed .lp-role-caret{transform:rotate(-90deg)}
.lp-role.collapsed .lp-role-docs{display:none}
.lp-role-color{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.lp-role-name{flex:1}
.lp-role-count{font-size:9px;color:#999;background:#e9ecef;padding:0 5px;border-radius:6px}
.lp-role-docs{padding:1px 0}
.lp-doc{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 34px;cursor:pointer;font-size:10.5px;color:var(--text-sec);transition:all .1s;border-left:3px solid transparent}
.lp-doc:hover{background:var(--sidebar-hover);color:var(--text)}
.lp-doc.active{background:var(--sidebar-hover);border-left-color:var(--active-color);color:var(--active-color);font-weight:600}
.lp-doc-icon{font-size:11px;flex-shrink:0}
.lp-doc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-doc-arrow{font-size:8px;color:#bbb;flex-shrink:0}
.lp-doc:hover .lp-doc-arrow{color:var(--active-color)}

/* 右侧侧边栏（评分/扫描/映射/校验连线） */
.right-sidebar{position:fixed;top:46px;right:0;bottom:0;width:420px;background:var(--card);border-left:2px solid var(--card-border);z-index:98;transform:translateX(100%);transition:transform .25s ease;box-shadow:-2px 0 16px rgba(0,0,0,.08);display:flex;flex-direction:column}
.right-sidebar.open{transform:translateX(0)}
.rs-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--card-border);flex-shrink:0;background:var(--sidebar-bg);overflow-x:auto}
.rs-tabs::-webkit-scrollbar{height:3px}
.rs-tab{min-width:50px;padding:6px 1px;text-align:center;cursor:pointer;font-size:8.5px;font-weight:600;color:var(--text-sec);border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;user-select:none;flex-shrink:0}
.rs-tab:hover{color:var(--text);background:var(--hover-bg)}
.rs-tab.active{color:var(--active-color);border-bottom-color:var(--active-color)}
.rs-tab-icon{font-size:12px;display:block;margin-bottom:1px}
.rs-close{position:absolute;top:6px;right:10px;cursor:pointer;color:#888;font-size:15px;z-index:5;padding:3px 6px;display:none}
.rs-close.show{display:block}.rs-close:hover{color:var(--text)}
.rs-body{flex:1;overflow-y:auto;padding:12px;font-size:11px;line-height:1.6}
.rs-body::-webkit-scrollbar{width:4px}.rs-body::-webkit-scrollbar-thumb{background:#d0d4d9;border-radius:2px}

/* 评分面板 */
.rs-score-header{text-align:center;padding:4px 0 10px}
.rs-score-num{font-size:30px;font-weight:800;letter-spacing:-1px}
.rs-score-num.good{color:var(--green)}.rs-score-num.warn{color:var(--orange)}.rs-score-label{font-size:10px;color:#888}
.rs-dim-row{display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;font-size:10px;border-radius:4px;transition:all .1s}
.rs-dim-row:hover{background:var(--hover-bg)}
.rs-dim-name{width:50px;text-align:right;color:var(--text-sec);font-weight:600;flex-shrink:0;font-size:9.5px}
.rs-dim-bar-wrap{flex:1;height:7px;background:#e9ecef;border-radius:3px;overflow:hidden}
.rs-dim-bar{height:100%;border-radius:3px}.rs-dim-bar.comp{background:var(--blue)}.rs-dim-bar.trace{background:var(--phase-spec)}.rs-dim-bar.verif{background:var(--orange)}.rs-dim-bar.consist{background:var(--purple)}
.rs-dim-val{width:30px;font-weight:700;font-size:10px;text-align:left}
.rs-vfy-item{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;font-size:10px;border-radius:4px;transition:all .1s}
.rs-vfy-item:hover{background:var(--hover-bg)}
.rs-vfy-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.rs-vfy-icon.pass{background:#e8f5e9;color:var(--green)}.rs-vfy-icon.issue{background:#ffebee;color:var(--red)}.rs-vfy-name{flex:1}.rs-vfy-badge{font-size:9px;color:#888}

/* 扫描面板 */
.rs-scan-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;font-size:10px;border-bottom:1px solid var(--card-border);opacity:0;transform:translateX(-8px);transition:all .2s}
.rs-scan-item.show{opacity:1;transform:translateX(0)}
.rs-scan-icon{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;margin-top:1px}
.rs-scan-icon.pass{background:#e8f5e9;color:var(--green)}.rs-scan-icon.warn{background:#fff3e0;color:var(--orange)}.rs-scan-text{flex:1;line-height:1.3}
.rs-scan-note{font-size:9px;color:#888;margin-top:1px}
.rs-scan-bar-wrap{padding:8px 0}.rs-scan-bar{height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden}
.rs-scan-bar-fill{height:100%;background:var(--green);transition:width .25s;border-radius:2px}
.rs-scan-summary{font-size:10px;color:var(--text-sec);padding:4px 0}

/* 映射/连线信息面板 */
.rs-map-group{margin-bottom:10px}.rs-map-title{font-size:10px;font-weight:700;color:var(--active-color);margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--card-border)}
.rs-map-row{display:flex;gap:6px;padding:2px 0;font-size:10px;align-items:center}.rs-map-src{color:var(--text);font-weight:600;width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs-map-arrow{color:#bbb;flex-shrink:0}.rs-map-spec{color:var(--active-color);font-weight:600}.rs-map-note{font-size:9px;color:#888;margin-left:4px}
.rs-info-tip{font-size:9.5px;color:#888;padding:6px 10px;background:var(--sidebar-bg);border-radius:4px;margin-top:6px;line-height:1.5}

/* 演练面板 */
.rs-walk-step{padding:6px 8px;border-radius:4px;cursor:pointer;border-left:3px solid transparent;background:var(--sidebar-bg);margin-bottom:2px;transition:all .12s}
.rs-walk-step:hover{background:var(--hover-bg)}
.rs-walk-step.active{border-left-color:var(--green);background:#e8f5e9}
.rs-walk-step .wl-label{font-size:8.5px;color:var(--green);font-weight:700}
.rs-walk-step .wl-title{font-size:10.5px;font-weight:700;color:var(--text)}
#wlDetail{font-size:10px}#wlDetail em{color:var(--blue);font-style:normal;font-weight:600}

/* 任务面板 */
.task-card{border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--sidebar-bg);transition:all .12s}
.task-card:hover{border-color:var(--active-color)}
.task-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.task-id{font-size:10px;font-weight:800;background:var(--active-color);color:#fff;padding:1px 6px;border-radius:3px}
.task-phase{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.task-phase.s1{background:#e8f5e9;color:#2e7d32}.task-phase.s2{background:#fff3e0;color:#e65100}.task-phase.s3{background:#e3f2fd;color:#1565c0}
.task-name{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.task-desc{font-size:9.5px;color:var(--text-sec);line-height:1.4;margin-bottom:4px}
.task-meta{display:flex;gap:8px;font-size:9px;color:#888;flex-wrap:wrap}
.task-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.task-btn{padding:3px 10px;border-radius:4px;border:1px solid var(--card-border);cursor:pointer;font-size:9.5px;font-weight:600;transition:all .12s;background:var(--card);color:var(--text-sec)}
.task-btn:hover{background:var(--hover-bg);border-color:var(--active-color)}
.task-btn.jira{background:#0052cc;color:#fff;border-color:#0052cc}.task-btn.jira:hover{background:#0043a8}
.task-btn.tb{background:#4e6af0;color:#fff;border-color:#4e6af0}.task-btn.tb:hover{background:#3d56c9}
.task-milestone{margin:8px 0 12px;display:flex;gap:6px}
.task-ms-dot{flex:1;text-align:center;padding:6px 4px;border-radius:6px;font-size:9px;font-weight:700;color:#fff}
.task-ms-dot.s1{background:var(--phase-spec)}.task-ms-dot.s2{background:var(--orange)}.task-ms-dot.s3{background:var(--blue)}

/* 流程面板 */
.flow-phase{border-left:3px solid var(--card-border);padding:4px 0 4px 12px;margin:2px 0;transition:all .15s}
.flow-phase:hover{border-left-color:var(--active-color)}
.flow-phase-title{font-size:11px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.flow-phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.flow-phase-who{font-size:9px;color:#888;margin-left:auto}
.flow-phase-items{font-size:9.5px;color:var(--text-sec);line-height:1.6;padding:2px 0 2px 16px}
.flow-arrow{text-align:center;color:#bbb;font-size:14px;padding:2px 0}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:8px;background:var(--sidebar-bg);border-radius:6px}
.flow-legend-item{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-sec)}
.flow-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* 变更面板 */
.change-card{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.change-title{font-size:10.5px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.change-diff{display:flex;gap:4px;align-items:center;margin:6px 0}
.change-diff-item{flex:1;text-align:center;padding:4px;border-radius:4px;font-size:9px}
.change-diff-item .cd-val{font-size:16px;font-weight:800}.change-diff-item .cd-label{font-size:8px;color:#888}
.change-up{color:var(--green)}.change-down{color:var(--red)}.change-same{color:#888}
.change-bar{height:4px;border-radius:2px;background:#e9ecef;margin:4px 0;overflow:hidden}
.change-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.fuzz-meter{display:flex;gap:3px;margin:6px 0}
.fuzz-seg{flex:1;height:6px;border-radius:3px;background:#e9ecef}
.fuzz-seg.filled.high{background:var(--red)}.fuzz-seg.filled.med{background:var(--orange)}.fuzz-seg.filled.low{background:var(--green)}
.log-item{padding:5px 0;border-bottom:1px solid var(--card-border);display:flex;gap:6px;font-size:10px;align-items:flex-start}
.log-time{color:#888;font-size:9px;white-space:nowrap;min-width:62px}
.log-skill{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
.log-desc{flex:1;color:var(--text);line-height:1.3}
.doc-change-item{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:9.5px}
.doc-change-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* 版本时间线 */
.version-timeline{position:relative;padding-left:24px}
.version-timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--card-border)}
.ver-node{position:relative;margin-bottom:14px}
.ver-node::before{content:'';position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--active-color);background:var(--card);z-index:1}
.ver-node.current::before{background:var(--active-color);box-shadow:0 0 0 4px rgba(30,136,229,.2)}
.ver-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ver-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:4px;color:#fff;background:var(--active-color)}
.ver-time{font-size:9px;color:#888}
.ver-skill-tag{font-size:8.5px;padding:1px 5px;border-radius:3px;background:var(--sidebar-bg);color:var(--text-sec);font-weight:600}
.ver-docs{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.ver-doc{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600;border:1px solid var(--card-border)}
.ver-doc.done{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
.ver-doc.partial{background:#fff3e0;color:#e65100;border-color:#ffcc02}
.ver-doc.todo{background:#ffebee;color:#c62828;border-color:#ef9a9a}
.ver-doc.untouched{background:#f5f5f5;color:#999}

/* 文档状态总览网格 */
.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:8px 0}
.status-cell{text-align:center;padding:4px 2px;border-radius:4px;font-size:8.5px;font-weight:700;border:1px solid var(--card-border)}
.status-cell.done{background:#e8f5e9;color:#2e7d32}.status-cell.attention{background:#fff3e0;color:#e65100}.status-cell.manual{background:#ffebee;color:#c62828}.status-cell.empty{background:#f5f5f5;color:#bbb}

/* 摘要条 */
.ver-summary{margin-top:8px;padding:8px;border-radius:6px;background:var(--sidebar-bg);font-size:10px;line-height:1.6}
.ver-summary-row{display:flex;align-items:center;gap:4px;margin:2px 0}
.rs-walk-nav{display:flex;gap:6px;margin-top:8px;justify-content:space-between}
.rs-walk-btn{padding:5px 14px;border-radius:5px;border:1px solid var(--card-border);cursor:pointer;font-size:11px;font-weight:600;background:var(--card);color:var(--text-sec)}
.rs-walk-btn:hover{background:var(--hover-bg)}.rs-walk-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}

/* 设置弹窗 */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.settings-overlay.open{display:flex}
.settings-box{background:var(--card);border-radius:12px;width:420px;max-width:90vw;padding:20px 24px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.settings-box h3{font-size:15px;margin-bottom:14px;color:var(--text)}
.settings-row{margin-bottom:10px}
.settings-row label{display:block;font-size:11px;font-weight:600;color:var(--text-sec);margin-bottom:4px}
.settings-row input{width:100%;padding:7px 10px;border:1px solid var(--card-border);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text)}
.settings-row input:focus{outline:none;border-color:var(--active-color)}
.settings-hint{font-size:9.5px;color:#888;margin-top:4px}
.settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.settings-actions .btn-primary{background:var(--active-color);color:#fff;border-color:var(--active-color)}

/* LLM校验结果 */
.llm-loading{text-align:center;padding:30px;font-size:12px;color:var(--text);line-height:2}
.llm-loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid #e0e0e0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.llm-result-item{padding:6px 0;border-bottom:1px solid var(--card-border);font-size:10.5px;line-height:1.5}
.llm-result-item .llm-icon{font-size:12px;margin-right:4px}

/* 右侧文档预览面板 */
.doc-viewer{position:fixed;top:46px;right:0;bottom:0;width:45%;max-width:680px;background:var(--card);border-left:2px solid var(--card-border);z-index:100;transform:translateX(100%);transition:transform .3s ease;box-shadow:-4px 0 20px rgba(0,0,0,.1);display:flex;flex-direction:column}
.doc-viewer.open{transform:translateX(0)}
.doc-viewer-header{padding:10px 14px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.doc-viewer-header .doc-source{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;color:#fff}
.doc-viewer-header .doc-source.src-demand{background:var(--orange)}
.doc-viewer-header .doc-source.src-pm{background:var(--phase-proposal)}
.doc-viewer-header .doc-source.src-dev{background:var(--blue)}
.doc-viewer-header .doc-source.src-test{background:var(--phase-test)}
.doc-viewer-header .doc-source.src-spec{background:var(--green)}
.doc-viewer-header .doc-source.src-skill{background:var(--purple)}
.doc-viewer-header .doc-name{font-size:13px;font-weight:700;color:var(--text);flex:1}
.doc-viewer-close{cursor:pointer;color:#888;font-size:16px;padding:4px 6px;margin-left:auto}
.doc-viewer-close:hover{color:var(--text)}
.doc-viewer-body{padding:14px;overflow-y:auto;flex:1;font-size:12.5px;line-height:1.8;color:var(--text)}
.doc-viewer-body h1{font-size:17px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--card-border)}
.doc-viewer-body h2{font-size:14px;margin:14px 0 6px;color:var(--blue)}
.doc-viewer-body h3{font-size:12.5px;margin:10px 0 4px}

.doc-viewer-body th,.doc-viewer-body td{border:1px solid var(--card-border);padding:3px 6px;text-align:left}
.doc-viewer-body th{background:var(--sidebar-bg);font-weight:600}
.doc-viewer-body code{background:rgba(0,0,0,.05);padding:1px 4px;border-radius:2px;font-size:10.5px}
.doc-viewer-body pre{background:var(--sidebar-bg);padding:8px 12px;border-radius:5px;overflow-x:auto;font-size:10.5px;line-height:1.4;margin:6px 0}

.doc-viewer-body strong{color:#e65100}
.doc-viewer-body ul,ol{padding-left:20px}

/* 画布节点 */
.node{position:absolute;width:205px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;z-index:10;user-select:none;overflow:hidden;border:1.5px solid var(--card-border);font-size:10px;transition:box-shadow .15s,opacity .2s;text-align:center}
.node:hover{box-shadow:var(--shadow-md);z-index:20}
.node.highlight{box-shadow:0 0 0 3px #ffd54f,var(--shadow-md);z-index:30}
.node.locked{box-shadow:0 0 0 3px var(--blue),var(--shadow-md);z-index:31}
.node.dim{opacity:var(--dim-opacity)}
.node.filled{border-color:var(--green)}
.node.filled::after{content:'✓';position:absolute;top:4px;right:6px;font-size:9px;color:var(--green);font-weight:800}
.node.empty{border-style:dashed;border-color:#bbb;opacity:.55}
.node-header{padding:5px 8px;font-size:9px;font-weight:700;letter-spacing:.4px;color:#fff}
.node-name{padding:5px 8px;min-height:26px;font-size:10.5px;font-weight:700;line-height:1.3;border-bottom:1px solid var(--card-border);color:var(--text)}
.node-skill-tag{display:inline-block;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:4px;background:rgba(0,0,0,.08)}
.node .fill-by{font-size:8px;color:#888;margin-top:2px}
.node-sections{padding:2px 0}
.node-sec{padding:2px 8px;font-size:9px;color:var(--text-sec);line-height:1.3;transition:background .1s;border-left:2px solid transparent;margin:1px 0;text-align:left}
.node-sec:hover{background:var(--hover-bg);border-left-color:var(--active-color)}

.hdr-meta{background:var(--phase-meta)}
.hdr-proposal{background:var(--phase-proposal)}
.hdr-spec{background:var(--phase-spec)}
.hdr-design{background:var(--phase-design)}
.hdr-plan{background:var(--phase-plan)}
.hdr-test{background:var(--phase-test)}
.hdr-trace{background:var(--phase-trace)}

/* 连线 */
.edge{fill:none;stroke:#c5cae9;stroke-width:1.2;transition:stroke .2s,stroke-width .2s,opacity .3s}
.dark .edge{stroke:#2a3a5c}
.edge.node-edge{stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 3}
.edge.highlight{stroke:var(--orange);stroke-width:2.5;stroke-dasharray:none}
.edge.dim{opacity:.05}
.edge.map-line{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:3 3}
.edge.verify-line{stroke:var(--purple);stroke-width:1.5;stroke-dasharray:2 4}
.edge-arrow{fill:#bdbdbd}.edge-arrow.highlight{fill:var(--orange)}.edge-arrow.dim{opacity:.05}

/* Walkthrough */
.walkthrough{position:fixed;bottom:0;left:280px;right:0;background:var(--card);border-top:2px solid var(--green);z-index:120;transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
.walkthrough.open{transform:translateY(0)}
.wt-inner{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center}
.wt-progress{display:flex;gap:3px;flex-shrink:0}
.wt-dot{width:9px;height:9px;border-radius:50%;background:#e0e0e0;cursor:pointer;transition:all .15s}
.wt-dot.done{background:#81c784}.wt-dot.current{background:var(--green);transform:scale(1.3);box-shadow:0 0 5px rgba(76,175,80,.5)}
.wt-content{flex:1;min-width:0}
.wt-step-label{font-size:10px;color:var(--green);font-weight:700;margin-bottom:2px}
.wt-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.wt-desc{font-size:11.5px;color:var(--text-sec);line-height:1.5}
.wt-desc em{color:var(--blue);font-weight:600;font-style:normal}
.wt-nav{display:flex;gap:6px;flex-shrink:0}
.wt-btn{padding:5px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.wt-btn-prev{background:#f5f5f5;color:#555}.wt-btn-next{background:var(--green);color:#fff}
.wt-btn-next:hover{background:#43a047}.wt-btn-close{background:#eee;color:#888;padding:5px 10px}

.sc-check{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:11px;border-bottom:1px solid var(--card-border);opacity:0;transform:translateX(-10px);transition:all .25s}

.sc-check-icon.warn{background:#fff3e0;color:var(--orange)}
.sc-check-icon.fail{background:#ffebee;color:var(--red)}

.scanner-foot{padding:10px 20px;border-top:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;font-size:12px}

.scanner-btn{padding:5px 16px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:var(--active-color);color:#fff}
.scanner-btn:hover{opacity:.9}

/* Score badge in verify panel */

const SCORE_FRAMEWORK = {
  completeness: {label:'完整性',weight:30,max:30,skill:'mumu-spec-check',key:'completeness'},
  traceability: {label:'可追溯性',weight:25,max:25,skill:'align-trace + align-prd-us',key:'traceability'},

  consistency: {label:'一致性',weight:20,max:20,skill:'align-api-db',key:'consistency'},
};
let SCORE_DATA = {};

// 模糊词列表
const FUZZY_WORDS = ['尽量','大概','可能','建议','友好','应该','适当','酌情','差不多','基本上','一般来说'];

// ── 真实文档分析 ──
function runRealChecks() {
  // 需要分析的文档（排除02占位、01总则）
  const targetDocs = ['03','04','05','06','07','08','09','10','11','12','13','14'];
  const docNames = {'03':'立项提案','04':'PRD','05':'用户故事','06':'FSD','07':'NFR','08':'架构','09':'API契约','10':'数据模型','11':'安全设计','12':'实施计划','13':'测试策略','14':'RTM追溯'};

  // 1. 完整性检查：每篇文档是否存在 + 有无占位符
  let completenessChecks = [];
  let filledCount = 0, placeholderCount = 0;
  targetDocs.forEach(id => {
    const content = DOCS[id];
    if (!content) {
      completenessChecks.push({item:(id+' '+docNames[id]+' — 文档不可访问'),result:'fail',note:'fetch 失败，请通过 HTTP 服务打开'});
      return;
    }
    const stripped = content.replace(/^---\n[\s\S]*?\n---\n*/, ''); // 去除 frontmatter
    const placeholders = stripped.match(/【[^】]*填写[^】]*】/g) || [];
    const fuzzyHits = [];
    FUZZY_WORDS.forEach(w => {
      const re = new RegExp(w, 'g');
      const matches = stripped.match(re);
      if (matches) fuzzyHits.push(w + '(' + matches.length + ')');
    });
    if (placeholders.length === 0) {
      filledCount++;
      const note = fuzzyHits.length ? '⚠ 模糊词: ' + fuzzyHits.join(', ') : '内容完整，无占位符';
      completenessChecks.push({item:(id+' '+docNames[id]+' — '+placeholders.length+'个占位符'),result:fuzzyHits.length?'warn':'pass',note:note});
    } else {
      placeholderCount++;
      completenessChecks.push({item:(id+' '+docNames[id]+' — '+placeholders.length+'个占位符残留'),result:'warn',note:'仍有【填写】未替换: ' + placeholders.slice(0,3).join(', ')});
    }
  });
  // 02 单独检查
  const doc02 = DOCS['02'];
  if (doc02) {
    const p02 = (doc02.replace(/^---\n[\s\S]*?\n---\n*/, '').match(/【[^】]*填写[^】]*】/g) || []).length;
    completenessChecks.unshift({item:'02 需求采集 — 会议纪要/痛点/访谈',result:p02===0?'pass':'warn',note:p02===0?'已有素材来源':'无素材，'+p02+'个占位符待补充'});
  }
  // 01 始终通过
  completenessChecks.unshift({item:'01 写作总则 — 铁律/编号规则/阶段流程',result:'pass',note:'框架文档，始终完整'});

  const compScore = Math.round((filledCount / targetDocs.length) * 30);
  const compDesc = filledCount+'/'+targetDocs.length+'篇完整填充。'+(placeholderCount>0?placeholderCount+'篇有占位符残留。':'')+(doc02&&(doc02.match(/【[^】]*填写[^】]*】/g)||[]).length>0?'02无素材来源。':'');

  // 2. 可追溯性检查：提取编号并校验
  let traceChecks = [];
  const allIds = {REQ:[],US:[],TC:[]};
  targetDocs.forEach(id => {
    const content = DOCS[id] || '';
    const reqs = content.match(/REQ-M1BL-\d+/g) || [];
    const us = content.match(/US-\d+/g) || [];
    const tcs = content.match(/TC-M1BL-\d+/g) || [];
    allIds.REQ.push(...reqs); allIds.US.push(...us); allIds.TC.push(...tcs);
  });
  // 去重
  const uniqueREQ = [...new Set(allIds.REQ)];
  const uniqueUS = [...new Set(allIds.US)];
  const uniqueTC = [...new Set(allIds.TC)];

  traceChecks.push({item:'需求编号统计',result:'pass',note:'REQ: '+uniqueREQ.length+'个, US: '+uniqueUS.length+'个, TC: '+uniqueTC.length+'个'});
  // 编号唯一性
  const dupREQ = allIds.REQ.length - uniqueREQ.length;
  const dupUS = allIds.US.length - uniqueUS.length;
  const dupTC = allIds.TC.length - uniqueTC.length;
  if (dupREQ+dupUS+dupTC === 0) {
    traceChecks.push({item:'编号唯一性检查',result:'pass',note:'所有REQ/US/TC编号无重复'});
  } else {
    traceChecks.push({item:'编号唯一性检查',result:'warn',note:'REQ重复'+dupREQ+'次, US重复'+dupUS+'次, TC重复'+dupTC+'次'});
  }

  // 交叉引用：检查09是否被05引用
  const doc05 = DOCS['05'] || '';
  const doc09 = DOCS['09'] || '';
  const doc14 = DOCS['14'] || '';
  const refs09in05 = doc05.includes('09') || doc05.includes('API');
  const refs14in05 = doc05.includes('14') || doc14.includes('US-');
  traceChecks.push({item:'05→09 交叉引用',result:refs09in05?'pass':'warn',note:refs09in05?'05引用了09 API':'05未明确引用09 API契约'});
  traceChecks.push({item:'05→14 追溯索引',result:refs14in05?'pass':'warn',note:refs14in05?'05与14存在交叉引用':'05追溯索引待完善'});

  // API端点检查
  const apiEndpoints = doc09.match(/\/api\/v\d+\/\w+/g) || [];
  traceChecks.push({item:'API端点统计',result:apiEndpoints.length>0?'pass':'warn',note:apiEndpoints.length+'个端点定义: '+apiEndpoints.join(', ')});

  // 每条P0 REQ至少1条TC
  const p0REQs = uniqueREQ.filter(r => {
    const content = DOCS['05'] || '';
    return content.includes(r) && content.includes('P0');
  });
  const tcPerREQ = p0REQs.length > 0 && uniqueTC.length >= p0REQs.length;
  traceChecks.push({item:'P0 REQ → TC 覆盖',result:tcPerREQ?'pass':'warn',note:p0REQs.length+'条P0 REQ, '+uniqueTC.length+'条TC'+(tcPerREQ?' ✓':' ⚠ 可能不足')});

  const traceScore = Math.min(25, 15 + uniqueREQ.length*2 + (tcPerREQ?3:0));
  const traceDesc = uniqueREQ.length+'条REQ → '+uniqueUS.length+'条US → '+apiEndpoints.length+'个API → '+uniqueTC.length+'条TC。'+(dupREQ+dupUS+dupTC===0?'编号唯一 ✓':'⚠ 编号重复');

  // 3. 可验证性检查
  let verifChecks = [];
  let fuzzyTotal = 0;
  targetDocs.forEach(id => {
    const content = DOCS[id] || '';
    const stripped = content.replace(/^---\n[\s\S]*?\n---\n*/, '');
    let docFuzzy = 0;
    FUZZY_WORDS.forEach(w => {
      const re = new RegExp(w, 'g');
      const m = stripped.match(re);
      if (m) docFuzzy += m.length;
    });
    fuzzyTotal += docFuzzy;
    if (docFuzzy > 0) {
      verifChecks.push({item:(id+' '+docNames[id]+' — 模糊词检测'),result:'warn',note:'发现 '+docFuzzy+' 处模糊表述'});
    }
  });
  // AC可测试性：检查是否包含数字/状态码等可验证要素
  const hasTestableAC = (doc05.match(/AC-\d+-\d+/g)||[]).length >= 3;
  verifChecks.push({item:'AC可测试性',result:hasTestableAC?'pass':'warn',note:(doc05.match(/AC-\d+-\d+/g)||[]).length+'条AC定义'});
  // JSON示例检查
  const hasJsonExample = (doc09.match(/```json/g)||[]).length > 0;
  verifChecks.push({item:'09 API JSON示例',result:hasJsonExample?'pass':'fail',note:hasJsonExample?'有JSON请求/响应示例':'缺少JSON示例！'});

  if (verifChecks.length === 0) verifChecks.push({item:'所有文档可验证性',result:'pass',note:'未发现模糊词'});
  const verifScore = Math.max(0, 25 - Math.min(10, fuzzyTotal));
  const verifDesc = '共发现 '+fuzzyTotal+' 处模糊词。'+(hasJsonExample?'09有JSON示例 ✓':'')+(hasTestableAC?' AC可测试 ✓':'');

  // 4. 一致性检查
  let consistChecks = [];
  // 09与10字段交叉检查
  const fields09 = (doc09.match(/`(\w+)`/g)||[]).map(s=>s.replace(/`/g,''));
  const fields10 = ((DOCS['10']||'')).match(/`(\w+)`/g)||[];
  const commonFields = fields09.filter(f => fields10.some(f10=>f10.includes(f)));
  consistChecks.push({item:'09↔10 字段一致性',result:commonFields.length>0?'pass':'warn',note:'共同字段: '+(commonFields.length>0?commonFields.slice(0,5).join(', '):'未检测到')});
  // 检查是否有明显的文档内矛盾（简单的关键词检查）
  const hasBothReasons = (DOCS['08']||'').includes('无持久化') || (DOCS['10']||'').includes('不持久化');
  consistChecks.push({item:'08↔10 存储策略一致',result:hasBothReasons?'pass':'warn',note:hasBothReasons?'均声明P0无持久化':'存储策略描述不一致'});
  // traceId格式一致性
  const traceIdIn09 = (doc09.match(/tr_\{?uuid/)||[]).length > 0;
  const traceIdIn07 = ((DOCS['07']||'').match(/tr_\{?uuid/)||[]).length > 0;
  consistChecks.push({item:'traceId格式一致(07↔09)',result:(traceIdIn09||traceIdIn07)?'pass':'warn',note:(traceIdIn09||traceIdIn07)?'tr_{uuid.hex} 格式一致':'traceId格式待确认'});

  const consistScore = Math.min(20, 10 + commonFields.length*2 + (hasBothReasons?2:0) + ((traceIdIn09||traceIdIn07)?2:0));
  const consistDesc = commonFields.length+'个共同字段，存储策略'+(hasBothReasons?'一致':'待确认')+'。';

  // 汇总
  SCORE_DATA = {
    completeness: {label:'完整性',weight:30,score:compScore,max:30,skill:'mumu-spec-check',desc:compDesc,checks:completenessChecks},
    traceability: {label:'可追溯性',weight:25,score:traceScore,max:25,skill:'align-trace + align-prd-us',desc:traceDesc,checks:traceChecks},
    verifiability: {label:'可验证性',weight:25,score:verifScore,max:25,skill:'align-us-api',desc:verifDesc,checks:verifChecks},
    consistency: {label:'一致性',weight:20,score:consistScore,max:20,skill:'align-api-db',desc:consistDesc,checks:consistChecks},
  };

  // 重绘面板
  buildScorePanel();
  buildVerifyPanel();
  updateVerifyStatus();
}

// 根据真实分析更新校验项状态
function updateVerifyStatus() {
  const sd = SCORE_DATA;
  VERIFY_ITEMS.forEach(v => {
    if (v.id === 'v-check') {
      const cs = sd.completeness;
      v.status = cs.score >= cs.max*0.8 ? 'pass' : cs.score >= cs.max*0.5 ? 'issue' : 'pending';
      v.detail = cs.desc;
    } else if (v.id === 'v-trace') {
      v.status = sd.traceability.score >= 20 ? 'pass' : 'issue';
      v.detail = sd.traceability.desc;
    } else if (v.id === 'v-us-api') {
      v.status = sd.verifiability.score >= 20 ? 'pass' : 'issue';
      v.detail = sd.verifiability.desc;
    } else if (v.id === 'v-api-db') {
      v.status = sd.consistency.score >= 15 ? 'pass' : 'issue';
      v.detail = sd.consistency.desc;
    }
  });
}

// 总分
function calcScore() {
  let total=0, max=0;
  Object.values(SCORE_DATA).forEach(d=>{total+=d.score;max+=d.max;});
  return {total,max,pct:max>0?Math.round(total/max*100):0};
}

  for (const [id, fn] of Object.entries(specFiles)) { try { const r=await fetch(fn); if(r.ok) DOCS[id]=await r.text(); }catch(e){ DOCS[id]=null; } }
  for (const role of SOURCES) {
    for (const doc of role.docs) {
      try { const r=await fetch(doc.path); if(r.ok) SRC_DOCS[doc.id]=await r.text(); }catch(e){ SRC_DOCS[doc.id]=null; }
    }
  }
  try { const r=await fetch('03-操作日志-转换与校验记录.md'); if(r.ok) LOG_CONTENT=await r.text(); }catch(e){ LOG_CONTENT=null; }
}

// 渲染连线
function drawEdges() {
  svgLayer.innerHTML = '';
  svgLayer.setAttribute('width', CANVAS_W);
  svgLayer.setAttribute('height', CANVAS_H);
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = '<marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" class="edge-arrow"/></marker><marker id="ahHL" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" class="edge-arrow highlight"/></marker>';
  svgLayer.appendChild(defs);

  function drawEdge(fid, tid, cls) {
    const fe = nodeEls[fid], te = nodeEls[tid];
    if (!fe || !te) return;
    const fx = parseFloat(fe.style.left) + fe.offsetWidth;
    const fy = parseFloat(fe.style.top) + fe.offsetHeight/2;
    const tx = parseFloat(te.style.left), ty = parseFloat(te.style.top) + te.offsetHeight/2;
    const dx = Math.abs(tx-fx)*0.4;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', `M${fx},${fy} C${fx+dx},${fy} ${tx-dx},${ty} ${tx},${ty}`);
    p.setAttribute('class', cls || 'edge node-edge');
    p.setAttribute('marker-end', 'url(#ah)');
    p.dataset.from = fid; p.dataset.to = tid;
    svgLayer.appendChild(p);
  }
  EDGES_SPEC.forEach(e => drawEdge(e.f, e.t, 'edge node-edge'));
  EDGES_VERIFY.forEach(e => drawEdge(e.f, e.t, 'edge verify-line'));
}
setTimeout(drawEdges, 100);

Object.values(nodeEls).forEach(el => {

function md2html(md) {
  if (!md) return '<p style="color:#888;text-align:center;padding:30px">无法加载文档<br><small>请通过 HTTP 服务打开此页面</small></p>';
  let c = md.replace(/^---\n[\s\S]*?\n---\n*/, '');
  if (typeof marked !== 'undefined') { marked.setOptions({breaks:true,gfm:true}); return marked.parse(c); }
  return '<pre>'+c.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre>';
}

  const p = document.getElementById('docViewer');
  document.getElementById('dvSource').textContent = sourceLabel;
  document.getElementById('dvSource').className = 'doc-source '+sourceClass;
  document.getElementById('dvName').textContent = name;
  document.getElementById('dvBody').innerHTML = md2html(content);

}

}

const wrap = document.getElementById('canvasWrap');
let scale=0.65, panX=30, panY=20, isPanning=false, psx=0, psy=0;
function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoomLabel').textContent = Math.round(scale*100)+'%';
}
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  isPanning=true; psx=e.clientX-panX; psy=e.clientY-panY; wrap.classList.add('panning');
});
document.addEventListener('mousemove', e => { if (isPanning) { panX=e.clientX-psx; panY=e.clientY-psy; applyTransform(); } });
document.addEventListener('mouseup', () => { isPanning=false; wrap.classList.remove('panning'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top, olds=scale;
  scale=Math.max(0.2,Math.min(1.5,scale*(e.deltaY>0?0.9:1.1)));
  panX=mx-(mx-panX)*(scale/olds); panY=my-(my-panY)*(scale/olds); applyTransform();
},{passive:false});
document.getElementById('zoomIn').addEventListener('click',()=>{scale=Math.min(1.5,scale*1.2);applyTransform()});
document.getElementById('zoomOut').addEventListener('click',()=>{scale=Math.max(0.2,scale/1.2);applyTransform()});
document.getElementById('zoomFit').addEventListener('click',()=>{
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  scale=Math.min(ww/CANVAS_W,wh/CANVAS_H)*0.9; panX=(ww-CANVAS_W*scale)/2; panY=(wh-CANVAS_H*scale)/2; applyTransform();
});

function showWalkDetail(i) {
  const s = WALK_STEPS[i];
  if (!s) return;
  const detailEl = document.getElementById('wlDetail');
  if (!detailEl) return;
  // 获取产出文档名称
  const outputs = s.nodes.filter(id => id!=='01'&&id!=='02').map(id => {
    const n = NODES.find(x=>x.id===id);
    return n ? `<span style="font-weight:600">${id}</span> ${n.title}` : id;
  });

  let html = `<div style="font-size:11px;line-height:1.7">`;
  html += `<div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)">${s.title}</div>`;
  html += `<div style="font-size:11px;color:var(--text-sec);margin-bottom:10px;line-height:1.6">${s.desc}</div>`;
  if (outputs.length) {
    html += `<div style="font-size:10px;font-weight:700;color:var(--green);margin-bottom:4px">📄 产出文档</div>`;
    html += outputs.map(o => `<div style="font-size:10px;padding:2px 0">${o}</div>`).join('');
  }

  html += `<div style="margin-top:10px;padding:8px;background:var(--sidebar-bg);border-radius:6px;font-size:9.5px;color:var(--text-sec);line-height:1.5">💡 <b>操作</b>：点击评分面板底部的 Skill 命令，复制提示词到 Claude Code 执行此步骤</div>`;

}

function showWalkStep(i) {
  walkStep = i; const s = WALK_STEPS[i];
  if (!s) return;
  clearHighlight();
  Object.values(nodeEls).forEach(n => { n.classList.remove('step-active','dim'); n.classList.toggle('dim',!s.nodes.includes(n.dataset.id)); });
  s.nodes.forEach(id => { if(nodeEls[id]) nodeEls[id].classList.add('step-active'); });
  svgLayer.querySelectorAll('path').forEach(p => {
    const pair = p.dataset.from+'-'+p.dataset.to;
    p.classList.remove('step-active','dim'); p.classList.toggle('dim', !s.edges.includes(pair));
    if (s.edges.includes(pair)) p.classList.add('step-active');
  });
  document.querySelectorAll('.rs-walk-step').forEach((el,j) => el.classList.toggle('active', j===i));
  showWalkDetail(i);
  // 自动保存快照（演练步骤 = 关键节点）
  if (i > 0) autoSnapshotAndDiff(WALK_STEPS[i].label);
}

// 文档变更检测（内容哈希）
function hashContent(content) {
  if (!content) return 0;
  let h = 0;
  for (let i=0; i<Math.min(content.length, 5000); i++) { h = ((h<<5)-h) + content.charCodeAt(i); h |= 0; }
  return h;
}
function detectDocChanges() {
  const prevHashes = lsGet('doc_hashes') || {};
  const changes = [];
  Object.entries(DOCS).forEach(([id, content]) => {
    const h = hashContent(content||'');
    if (prevHashes[id] && prevHashes[id] !== h) changes.push({id,changed:true});
    else if (!prevHashes[id]) changes.push({id,changed:false,first:true});
    else changes.push({id,changed:false});
    prevHashes[id] = h;
  });
  lsSet('doc_hashes', prevHashes);
  return changes;
}

// 需求模糊度分析
function analyzeFuzziness() {
  const sourceText = (SRC_DOCS['src-dem']||'') + (DOCS['03']||'') + (DOCS['04']||'');
  const srcCount = Object.values(SRC_DOCS).filter(v=>v).length;

  const dimensions = [
    {q:'目标用户明确', re:/用户|角色|角色|persona/i, score: sourceText.match(/用户|角色|persona/i) ? 2 : 0},
    {q:'核心场景定义', re:/场景|SC-|用户路径|user story/i, score: sourceText.match(/场景|SC-|用户路径/i) ? 2 : 0},
    {q:'性能要求量化', re:/\d+ms|\d+s|P95|P99|SLO|延迟|QPS/i, score: sourceText.match(/\d+ms|\d+s|P95|延迟/) ? 2 : 0},
    {q:'技术方案明确', re:/百炼|API|DashScope|SDK|架构/i, score: sourceText.match(/百炼|API|DashScope|架构/) ? 2 : 0},
    {q:'边界约束清晰', re:/不做|范围外|MUST NOT|限制|禁止/i, score: sourceText.match(/不做|范围外|限制/) ? 2 : 0},
    {q:'验收标准可测', re:/AC-|验收标准|200|400|401|MUST/i, score: sourceText.match(/AC-|验收标准|MUST/) ? 2 : 0},
    {q:'成功标准量化', re:/成功标准|可度量|分钟内|百分比/i, score: sourceText.match(/成功标准|可度量/) ? 2 : 0},
    {q:'风险识别充分', re:/风险|应对|降级|不可用|泄露/i, score: sourceText.match(/风险|应对|降级/) ? 2 : 0},
  ];

  const totalScore = dimensions.reduce((s,d)=>s+d.score, 0);
  const maxScore = dimensions.length * 2;
  const fuzzPct = Math.round((1 - totalScore/maxScore) * 100);

  return {
    pct: fuzzPct,
    level: fuzzPct <= 30 ? {label:'低',color:'var(--green)',cls:'low'} : fuzzPct <= 60 ? {label:'中',color:'var(--orange)',cls:'med'} : {label:'高',color:'var(--red)',cls:'high'},
    dimensions,
    srcCount,
    totalScore, maxScore,
    gaps: dimensions.filter(d=>d.score===0).map(d=>d.q),
    strengths: dimensions.filter(d=>d.score===2).map(d=>d.q),
  };
}

  let html = '';

  // 1. 分数变化

// 分析每个文档的状态
function analyzeDocStatus(docId) {
  const content = DOCS[docId];
  if (!content) return 'empty';
  const stripped = content.replace(/^---[\s\S]*?---/, '');
  const placeholders = (stripped.match(/【[^】]*填写[^】]*】/g) || []).length;
  if (placeholders > 3) return 'manual'; // 大量占位 → 需开发者自己处理
  if (placeholders > 0) return 'attention'; // 少量占位 → 需核对
  const fuzzyWords = ['尽量','大概','可能','建议','友好','应该','适当','酌情'];
  let fuzzyCount = 0;
  fuzzyWords.forEach(w => { const m = stripped.match(new RegExp(w,'g')); if(m) fuzzyCount+=m.length; });
  if (fuzzyCount > 2) return 'attention'; // 模糊词多 → 需核对
  return 'done'; // 填充完成
}

function saveSnapshot(type) {
  const snap = {
    time: Date.now(),
    label: (type==='auto'?'auto:':'') + (type||'manual'),
    docs: {},
    scores: calcScore(),
    dims: Object.fromEntries(Object.entries(SCORE_DATA).map(([k,d])=>[k,d.score]))

// 生成 Diff HTML
function buildDiffHtml(idx) {
  const snaps = lsGet('snapshots')||[];
  const snap = snaps[idx];
  if (!snap) return null;
  const curDocs = DOCS;
  const diffs = [];
  Object.entries(snap.docs).forEach(([id, oldContent]) => {
    const curContent = curDocs[id] || '';
    if (oldContent !== curContent) diffs.push({id, oldContent, curContent});
  });

  if (diffs.length === 0) return '<div style="color:#888;text-align:center;padding:16px">✅ 与快照一致，无变化</div>';

  let html = `<div style="font-size:10px;font-weight:700;margin-bottom:6px">🔍 Diff: ${snap.label?.replace('auto:','')||'快照'} → 当前</div>`;
  html += `<div style="font-size:9px;color:#888;margin-bottom:8px">${diffs.length}篇文档有变化 · 分数差 ${(calcScore().total-(snap.scores?.total||0))>=0?'+':''}${calcScore().total-(snap.scores?.total||0)}分</div>`;

  diffs.slice(0, 6).forEach(d => {
    const n = NODES.find(x=>x.id===d.id);
    const addedLines = []; const removedLines = []; const changedLines = [];
    const oldLines = d.oldContent.split('\n');
    const newLines = d.curContent.split('\n');
    const maxLen = Math.max(oldLines.length, newLines.length);

    for (let i=0; i<Math.min(maxLen, 40); i++) {
      const ol = oldLines[i] || '';
      const nl = newLines[i] || '';
      if (ol !== nl) {
        if (ol && !nl) removedLines.push(ol);
        else if (!ol && nl) addedLines.push(nl);
        else changedLines.push({old:ol, nu:nl});
      }
    }

    html += `<div style="margin-bottom:8px;border:1px solid var(--card-border);border-radius:6px;overflow:hidden">
      <div style="background:var(--sidebar-bg);padding:5px 8px;font-size:10px;font-weight:700;display:flex;justify-content:space-between;align-items:center">
        <span>${d.id} ${n?.title||''}</span>
        <span style="font-size:9px">${addedLines.length>0?`<span style="color:#2e7d32">+${addedLines.length}</span> `:''}${removedLines.length>0?`<span style="color:#c62828">−${removedLines.length}</span> `:''}${changedLines.length>0?`<span style="color:#e65100">~${changedLines.length}</span> `:''}行变化</span>
      </div>`;

    // 新增行
    addedLines.slice(0, 5).forEach(l => {
      html += `<div style="background:#e8f5e9;font-size:8.5px;padding:1px 8px;line-height:1.5;font-family:monospace"><span style="color:#2e7d32;font-weight:700">+ </span>${escapeHtml(l.substring(0,100))}</div>`;
    });
    if (addedLines.length > 5) html += `<div style="background:#e8f5e9;font-size:8px;padding:1px 8px;color:#888">... 共 ${addedLines.length} 行新增</div>`;

    // 删除行
    removedLines.slice(0, 3).forEach(l => {
      html += `<div style="background:#ffebee;font-size:8.5px;padding:1px 8px;line-height:1.5;font-family:monospace"><span style="color:#c62828;font-weight:700">− </span>${escapeHtml(l.substring(0,100))}</div>`;
    });
    if (removedLines.length > 3) html += `<div style="background:#ffebee;font-size:8px;padding:1px 8px;color:#888">... 共 ${removedLines.length} 行删除</div>`;

    // 修改行
    changedLines.slice(0, 3).forEach(l => {
      html += `<div style="background:#fff9c4;font-size:8.5px;padding:1px 8px;line-height:1.5;font-family:monospace"><span style="color:#e65100;font-weight:700">~ </span>${escapeHtml(l.nu.substring(0,100))}</div>`;
    });
    if (changedLines.length > 3) html += `<div style="background:#fff9c4;font-size:8px;padding:1px 8px;color:#888">... 共 ${changedLines.length} 行修改</div>`;

    html += '</div>';
  });
  return html;
}

// 显示Diff视图
function showDiffView() {
  const snaps = lsGet('snapshots')||[];
  if (snaps.length === 0) { showToast('⚠️ 请先保存快照'); return; }
  const snap = snaps[snaps.length-1];
  const changedIds = [];
  const diffs = [];

  Object.entries(snap.docs).forEach(([id, oldContent]) => {
    const curContent = DOCS[id] || '';
    if (oldContent !== curContent) {
      changedIds.push(id);
      diffs.push({id, oldContent, curContent});
    }
  });

  // 生成diff HTML
  let html = '<div style="font-size:10px;font-weight:700;margin-bottom:8px">🔍 快照对比 — ' + changedIds.length + '篇文档有变化</div>';

  if (diffs.length === 0) {
    html += '<div style="color:#888;text-align:center;padding:20px">✅ 所有文档与快照一致，无变化</div>';
  }

  diffs.slice(0, 4).forEach(d => {
    const n = NODES.find(x=>x.id===d.id);
    html += `<div style="margin-bottom:6px;border:1px solid var(--card-border);border-radius:6px;overflow:hidden">
      <div style="background:var(--sidebar-bg);padding:4px 8px;font-size:10px;font-weight:700">${d.id} ${n?.title||''}</div>`;
    // 简单行diff
    const oldLines = d.oldContent.split('\n');
    const newLines = d.curContent.split('\n');
    const maxLen = Math.max(oldLines.length, newLines.length);
    let diffLines = '';
    for (let i=0; i<Math.min(maxLen, 30); i++) {
      const ol = oldLines[i] || '';
      const nl = newLines[i] || '';
      if (ol !== nl) {
        if (ol && !nl) diffLines += `<div style="background:#ffebee;font-size:9px;padding:1px 6px"><span style="color:#c62828">−</span> ${escapeHtml(ol.substring(0,80))}</div>`;
        else if (!ol && nl) diffLines += `<div style="background:#e8f5e9;font-size:9px;padding:1px 6px"><span style="color:#2e7d32">+</span> ${escapeHtml(nl.substring(0,80))}</div>`;
        else diffLines += `<div style="background:#fff9c4;font-size:9px;padding:1px 6px"><span style="color:#e65100">~</span> ${escapeHtml(nl.substring(0,80))}</div>`;
      }
    }
    html += diffLines || '<div style="font-size:9px;color:#888;padding:4px 8px">（无显著行级差异）</div>';
    html += '</div>';
  });

  document.getElementById('rsPreview').innerHTML = `<div class="rp-preview">${html}</div>`;
  switchRSTab('preview');
}

## 05 用户故事
${doc05}

## 09 API接口
${doc09}

## 04 PRD（参考）
${doc04}

输出格式：{"acApiAlignment":[{"ac":"AC标识","status":"aligned|partial|missing","apiField":"09字段","note":"说明"}],"coverageGaps":["缺口"],"consistencyIssues":["不一致"],"suggestions":["建议"],"overallScore":85}`;

  try {
    const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:getModel(),messages:[{role:'system',content:'只输出JSON，不要markdown包裹'},{role:'user',content:prompt}],temperature:0.1,max_tokens:2000})
    });
    if (!resp.ok) { el.innerHTML=`<div style="color:var(--red);padding:20px">❌ API调用失败 (${resp.status})<br><span style="font-size:10px">请检查Key/模型（当前: ${getModel()}）</span></div>`; return; }
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '';
    let result;
    try { result = JSON.parse(content); } catch(e) { const m=content.match(/\{[\s\S]*\}/); result=m?JSON.parse(m[0]):{raw:content}; }

    let html = '<div style="font-weight:700;margin-bottom:6px;color:var(--green)">🤖 百炼语义分析 (模型: '+getModel()+')</div>';
    if (result.overallScore) html+=`<div style="text-align:center;font-size:22px;font-weight:800;color:var(--blue);margin:6px 0">${result.overallScore}<span style="font-size:11px;color:#888">/100</span></div>`;
    (result.acApiAlignment||[]).forEach(a=>{const ic=a.status==='aligned'?'✅':a.status==='partial'?'⚠️':'❌';html+=`<div class="llm-result-item"><span class="llm-icon">${ic}</span><b>${a.ac}</b>→${a.apiField||'无'}<br><span style="font-size:9px;color:#888">${a.note}</span></div>`;});
    if(result.coverageGaps?.length) html+='<div style="font-weight:600;margin:8px 0 4px;color:var(--orange)">⚠️ 覆盖缺口</div>'+result.coverageGaps.map(g=>`<div class="llm-result-item">• ${g}</div>`).join('');
    if(result.consistencyIssues?.length) html+='<div style="font-weight:600;margin:8px 0 4px;color:var(--red)">❌ 不一致</div>'+result.consistencyIssues.map(i=>`<div class="llm-result-item">• ${i}</div>`).join('');
    if(result.suggestions?.length) html+='<div style="font-weight:600;margin:8px 0 4px;color:var(--blue)">💡 建议</div>'+result.suggestions.map(s=>`<div class="llm-result-item">• ${s}</div>`).join('');
    el.innerHTML=html;
  } catch(e) { el.innerHTML=`<div style="color:var(--red);padding:20px">❌ ${e.message}</div>`; }
}

function exportReport() {

    md += `### ${d.label} (${d.score}/${d.max}) — ${d.skill}\n${d.desc}\n\n`;

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'spec-report-'+new Date().toISOString().slice(0,10)+'.md'; a.click();

}

// Qoder 跳转 + 代码生成
// ═══════════════════════════════════════
function openQoder(prompt) {
  const encoded = encodeURIComponent(prompt);
  // 尝试 Qoder 自定义协议
  const urls = [
    'qoder://chat?prompt='+encoded,
    'https://qoder.alibaba.com/chat?prompt='+encoded
  ];
  for (const url of urls) {
    try { window.open(url, '_blank'); return; } catch(e) {}
  }
  // 兜底：复制到剪贴板
  navigator.clipboard.writeText(prompt).then(()=>showToast('📋 已复制提示词（Qoder未检测到）'));
}

// 构建代码生成面板
function buildCodeGenPanel() {
  const el = document.getElementById('rsScore');
  if (!el || !Object.keys(SCORE_DATA).length) return;
  // 追加到评分面板底部
  let html = '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--card-border)"><div style="font-size:9px;color:#888;margin-bottom:4px">⚡ 生成代码（点击跳转 Qoder）</div>';
  CODE_GEN_PROMPTS.forEach(cg=>{
    const safePrompt = cg.prompt.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    html += `<div class="rs-vfy-item" style="cursor:pointer" onclick="openQoder('${safePrompt.replace(/\n/g,'\\n')}')" title="在Qoder中打开"><span style="font-size:11px">${cg.icon}</span><span class="rs-vfy-name">${cg.label}</span><span style="font-size:9px;color:var(--active-color)">生成代码</span></div>`;
  });
  html += '</div>';
  el.insertAdjacentHTML('beforeend', html);
}

// ═══════════════════════════════════════
// 下一步行动面板（基于检查结果）
// ═══════════════════════════════════════
function buildActionPanel() {
  const el = document.getElementById('rsVerify');
  if (!el || !Object.keys(SCORE_DATA).length) return;
  let actions = [];
  const compChecks = SCORE_DATA.completeness?.checks || [];
  const fuzzyWarns = compChecks.filter(c=>c.result==='warn'&&c.note?.includes('占位符'));
  const fuzzyTotal = compChecks.filter(c=>c.result==='warn'&&c.note?.includes('模糊词'));

  if (fuzzyWarns.length) actions.push({icon:'📝', text:`${fuzzyWarns.length}篇文档有占位符残留 → 运行 R1-R4 Skill 补充`, cmd:'/mumu-spec-r1-proposal', ctx:'检查并填充 Spec-3 下仍有【填写】占位符的文档'});
  if (fuzzyTotal.length) actions.push({icon:'✏️', text:`${fuzzyTotal.length}篇文档含模糊词 → 修改为可量化表述`, cmd:'', ctx:'移除模糊词（尽量/大概/建议/友好），改为MUST/SHOULD/具体数字'});
  const traceScore = SCORE_DATA.traceability?.score || 0;
  if (traceScore < 20) actions.push({icon:'🔗', text:'追溯链路不完整 → 运行 R2 Align 校准 05↔09', cmd:'/mumu-spec-r2-align', ctx:'重新校准05用户故事与09API契约的AC断言对应关系'});
  const consistScore = SCORE_DATA.consistency?.score || 0;
  if (consistScore < 15) actions.push({icon:'🔄', text:'跨文档一致性不足 → 检查 09↔10 字段、08↔10 存储策略', cmd:'', ctx:'逐字段对比09 API和10数据模型的字段名和类型是否一致'});

  if (actions.length === 0) {
    actions.push({icon:'✅', text:'全部检查通过！可以进入 Review 流程或生成代码', cmd:'', ctx:''});
  }

  let html = '<div style="margin-top:12px;padding-top:8px;border-top:2px solid var(--green)"><div style="font-size:10px;font-weight:700;color:var(--green);margin-bottom:6px">🎯 下一步行动建议</div>';
  actions.forEach(a=>{
    html += `<div class="llm-result-item" style="cursor:${a.cmd?'pointer':'default'}"><span style="font-size:12px">${a.icon}</span> ${a.text}</div>`;
    if (a.cmd) html += `<div style="text-align:right;margin-top:-2px;margin-bottom:2px"><code style="font-size:9px;color:var(--active-color);cursor:pointer" onclick="copyCmd('${a.cmd} ${a.ctx}')">📋 复制: ${a.cmd} ${a.ctx}</code></div>`;
  });
  html += '</div>';
  el.insertAdjacentHTML('beforeend', html);
}
